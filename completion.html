<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Wellora Completion</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: rgba(255, 255, 255, 0.95);
      --text: #261f1b;
      --muted: #6c5c53;
      --accent: #874826;
      --accent-soft: #e8d7cc;
      --border: rgba(230, 219, 210, 0.92);
      --shadow: 0 18px 40px rgba(127, 97, 74, 0.1);
      --button-shadow: 0 16px 28px rgba(127, 66, 34, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.98), transparent 20%),
        radial-gradient(circle at 100% 0, rgba(238, 213, 193, 0.28), transparent 18%),
        linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 8px;
    }

    .screen {
      width: min(100%, 540px);
      min-height: 100vh;
      position: relative;
      overflow: visible;
      background: linear-gradient(180deg, #fdfaf7 0%, #fbf6f0 100%);
      border-left: 1px solid rgba(228, 215, 205, 0.95);
      border-right: 1px solid rgba(228, 215, 205, 0.95);
      box-shadow: 0 18px 42px rgba(116, 89, 71, 0.12);
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 14px;
      color: var(--accent);
      background: rgba(253, 249, 244, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .close-button {
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(127, 97, 74, 0.08);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .close-button:hover,
    .close-button:focus-visible {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .close-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 800;
      color: var(--accent-strong, #6f381b);
      letter-spacing: -0.03em;
      text-align: center;
      flex: 1;
    }

    .header-spacer {
      width: 46px;
      flex-shrink: 0;
    }

    .content {
      flex: 1;
      padding: 6px 24px 140px;
      position: relative;
    }

    .celebration {
      position: absolute;
      inset: 0 0 auto;
      height: 260px;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      background: var(--accent-soft);
      border-radius: 999px;
      opacity: 0.9;
    }

    .confetti.one {
      width: 8px;
      height: 8px;
      top: 10px;
      left: 110px;
    }

    .confetti.two {
      width: 12px;
      height: 12px;
      top: 112px;
      right: 40px;
    }

    .confetti.three {
      width: 8px;
      height: 18px;
      top: 144px;
      left: 88px;
      border-radius: 2px;
      transform: rotate(-12deg);
    }

    .confetti.four {
      width: 10px;
      height: 10px;
      top: 34px;
      right: 108px;
    }

    .hero {
      position: relative;
      padding-top: 18px;
      text-align: center;
    }

    .hero-title {
      margin: 0;
      font-size: 3rem;
      line-height: 0.96;
      letter-spacing: -0.085em;
      font-weight: 800;
    }

    .hero-subtitle {
      margin: 12px 0 0;
      color: #6d5d54;
      font-size: 1rem;
      line-height: 1.5;
    }

    .stats {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      box-shadow: var(--shadow);
    }

    .stat-value {
      margin: 0;
      color: var(--accent);
      font-size: 1.08rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .stat-label {
      margin: 0;
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .message {
      margin: 30px auto 0;
      max-width: 280px;
      text-align: center;
      color: #4a3f39;
      font-size: 1rem;
      line-height: 1.75;
    }

    .actions {
      margin-top: 28px;
      display: grid;
      gap: 16px;
    }

    .primary-button,
    .secondary-button {
      width: 100%;
      min-height: 62px;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary-button {
      background: linear-gradient(180deg, #8a4b28 0%, #7a3d1d 100%);
      color: #fffaf5;
      box-shadow: var(--button-shadow);
    }

    .secondary-button {
      background: transparent;
      color: var(--accent);
      border: 2px solid rgba(138, 75, 40, 0.82);
    }

    .primary-button:hover,
    .primary-button:focus-visible,
    .secondary-button:hover,
    .secondary-button:focus-visible,
    .close-button:hover,
    .close-button:focus-visible,
    .nav-button:hover,
    .nav-button:focus-visible {
      transform: translateY(-1px);
    }


    .bottom-nav {
      position: sticky;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 252, 248, 0.98);
      border-top: 1px solid rgba(228, 215, 205, 0.92);
      padding: 12px 18px 16px;
      box-shadow: 0 -10px 24px rgba(106, 84, 67, 0.08);
      animation: navRise 0.45s ease-out;
      margin-top: auto;
      z-index: 30;
      pointer-events: auto;
    }

    .nav-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .nav-button {
      color: #ab9b90;
      display: grid;
      justify-items: center;
      gap: 6px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .nav-button span {
      color: #000 !important;
      font-size: 0.8rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .nav-pill {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-button.is-active {
      color: var(--accent);
    }

    .nav-button.is-active .nav-pill {
      background: var(--accent);
      color: #fffaf5;
      animation: activeNavBob 3s ease-in-out infinite;
      box-shadow: 0 8px 16px rgba(135, 72, 38, 0.18);
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      transform: translateY(-1px);
    }

    .nav-button:hover .nav-pill,
    .nav-button:focus-visible .nav-pill {
      transform: translateY(-2px);
    }

    .nav-button:hover svg,
    .nav-button:focus-visible svg {
      transform: scale(1.05);
    }

    @keyframes navRise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes activeNavBob {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @media (max-width: 360px) {
      .header,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .hero-title {
        font-size: 2.6rem;
      }
    }

    @media (max-width: 767px) {
      .page {
        padding: 0;
      }

      .screen {
        width: 100%;
        min-height: 100dvh;
        height: 100dvh;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }

      .content {
        padding: 6px 24px calc(env(safe-area-inset-bottom, 0px) + 140px);
      }

      .header {
        top: 0;
        padding-top: calc(env(safe-area-inset-top, 0px) + 22px);
      }

      .bottom-nav {
        bottom: 0;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      }
    }

    @media (min-width: 768px) {
      .page {
        padding: 18px;
      }

      .screen {
        border: 1px solid rgba(228, 215, 205, 0.95);
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="screen" aria-label="Exercise completion screen">
      <header class="header site-header">
        <button class="close-button" type="button" id="closeButton" aria-label="Close">
          <svg viewBox="0 0 24 24">
            <path d="M6 6l12 12"></path>
            <path d="M18 6 6 18"></path>
          </svg>
        </button>
        <h1 class="header-title">Well Done</h1>
        <span class="header-spacer" aria-hidden="true"></span>
      </header>

      <div class="content">
        <div class="celebration" aria-hidden="true">
          <span class="confetti one"></span>
          <span class="confetti two"></span>
          <span class="confetti three"></span>
          <span class="confetti four"></span>
        </div>

        <section class="hero" aria-labelledby="heroTitle">
          <h2 class="hero-title" id="heroTitle">Great job!</h2>
          <p class="hero-subtitle"><span id="completedExerciseName">Heel-to-toe walk</span> completed</p>
        </section>

        <section class="stats" aria-label="Progress summary">
          <article class="stat-card">
            <p class="stat-value"><span id="completedMinutesValue">12</span> min</p>
            <p class="stat-label">You completed</p>
          </article>

          <article class="stat-card">
            <p class="stat-value"><span id="streakValue">7</span> days</p>
            <p class="stat-label">Streak</p>
          </article>

          <article class="stat-card">
            <p class="stat-value"><span id="totalExercisesValue">24</span> total</p>
            <p class="stat-label">Exercises</p>
          </article>

          <article class="stat-card">
            <p class="stat-value"><span id="minutesTodayValue">12</span> minutes</p>
            <p class="stat-label">Today</p>
          </article>
        </section>

        <p class="message">Every small step builds strength. Take a breath, notice your progress, and keep the rhythm going.</p>

        <div class="actions">
          <button class="primary-button" type="button" id="nextExerciseButton">Next exercise</button>
          <button class="secondary-button" type="button" id="backHomeButton">Back to home</button>
        </div>
      </div>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <div class="nav-list">
          <button class="nav-button" type="button" id="homeButton" aria-label="Home">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span>Home</span>
          </button>

          <button class="nav-button is-active" type="button" id="progressButton" aria-label="Progress">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                <path d="M8 15v-3"></path>
                <path d="M12 15V8"></path>
                <path d="M16 15v-5"></path>
              </svg>
            </span>
            <span>Progress</span>
          </button>

          <button class="nav-button" type="button" id="profileButton" aria-label="Profile" data-i18n-aria-label="profileNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <span data-i18n="profileNav">Profile</span>
          </button>

          <button class="nav-button" type="button" aria-label="Guide" id="navGuideButton">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            </span>
            <span>Guide</span>
          </button>

          <button class="nav-button" type="button" aria-label="Ask Wellora AI" id="navAiButton"
            data-i18n-aria-label="aiNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>
              </svg>
            </span>
            <span data-i18n="aiNav">Wellora AI</span>
          </button>
        </div>
      </nav>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();
    const params = new URLSearchParams(window.location.search);
    const exerciseId = params.get("id") || "";
    const exerciseName = params.get("exercise_name") || params.get("name") || "Exercise";
    const exerciseCategory = params.get("category") || "";
    const minutes = Number(params.get("minutes")) || 12;
    const nextExerciseId = params.get("next_id") || "";

    const completedExerciseName = document.getElementById("completedExerciseName");
    const completedMinutesValue = document.getElementById("completedMinutesValue");
    const streakValue = document.getElementById("streakValue");
    const totalExercisesValue = document.getElementById("totalExercisesValue");
    const minutesTodayValue = document.getElementById("minutesTodayValue");
    const closeButton = document.getElementById("closeButton");
    const nextExerciseButton = document.getElementById("nextExerciseButton");
    const backHomeButton = document.getElementById("backHomeButton");
    const homeButton = document.getElementById("homeButton");
    const progressButton = document.getElementById("progressButton");

    completedExerciseName.textContent = exerciseName;
    completedMinutesValue.textContent = String(Math.max(1, Math.round(minutes)));

    function getProgressDurationSeconds(row, durationMap) {
      const spentSeconds = Number(row && row.duration_spent);

      if (Number.isFinite(spentSeconds) && spentSeconds > 0) {
        return spentSeconds;
      }

      return durationMap.get(row.exercise_id) || 0;
    }

    async function requireUser() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data || !data.user) {
        window.location.href = "login.html";
        return null;
      }

      return data.user;
    }

    function dayKeyFromIso(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function calculateStreak(rows) {
      const uniqueDays = Array.from(new Set(rows.map(function (row) {
        return dayKeyFromIso(row.created_at);
      }).filter(Boolean))).sort().reverse();

      if (!uniqueDays.length) {
        return 0;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const mostRecent = new Date(uniqueDays[0] + "T00:00:00");

      if (mostRecent.getTime() !== today.getTime() && mostRecent.getTime() !== yesterday.getTime()) {
        return 0;
      }

      let streak = 0;
      let cursor = new Date(mostRecent);

      for (let index = 0; index < uniqueDays.length; index += 1) {
        const expected = [
          cursor.getFullYear(),
          String(cursor.getMonth() + 1).padStart(2, "0"),
          String(cursor.getDate()).padStart(2, "0")
        ].join("-");

        if (uniqueDays[index] !== expected) {
          break;
        }

        streak += 1;
        cursor.setDate(cursor.getDate() - 1);
      }

      return streak;
    }

    async function loadCompletionSummary() {
      const user = await requireUser();

      if (!user) {
        return;
      }

      const { data, error } = await supabaseClient
        .from("user_progress")
        .select("created_at, count, exercise_id, duration_spent")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      if (error) {
        streakValue.textContent = "0";
        totalExercisesValue.textContent = "1";
        minutesTodayValue.textContent = String(minutes);
        return;
      }

      const progressRows = data || [];
      const exerciseIds = Array.from(new Set(progressRows.map(function (row) {
        return row.exercise_id;
      }).filter(function (value) {
        return value !== null && value !== undefined;
      })));

      let durationMap = new Map();

      if (exerciseIds.length) {
        const exerciseResult = await supabaseClient
          .from("EXERCISES")
          .select("id, duration_seconds")
          .in("id", exerciseIds);

        if (!exerciseResult.error && exerciseResult.data) {
          durationMap = new Map(exerciseResult.data.map(function (item) {
            return [item.id, Number(item.duration_seconds) || 0];
          }));
        }
      }

      const totalCompleted = progressRows.reduce(function (sum, row) {
        const rowCount = Number(row.count);
        return sum + (Number.isFinite(rowCount) && rowCount > 0 ? rowCount : 1);
      }, 0);

      const todayKey = dayKeyFromIso(new Date().toISOString());
      const minutesToday = progressRows.reduce(function (sum, row) {
        if (dayKeyFromIso(row.created_at) !== todayKey) {
          return sum;
        }

        const count = Number(row.count);
        const safeCount = Number.isFinite(count) && count > 0 ? count : 1;
        return sum + (getProgressDurationSeconds(row, durationMap) * safeCount);
      }, 0) / 60;

      streakValue.textContent = String(calculateStreak(progressRows));
      totalExercisesValue.textContent = String(totalCompleted || 1);
      minutesTodayValue.textContent = String(Math.max(1, Math.round(minutesToday || minutes)));
    }

    loadCompletionSummary();

    closeButton.addEventListener("click", function () {
      window.location.href = "home.html";
    });

    nextExerciseButton.addEventListener("click", function () {
      if (!nextExerciseId) {
        window.location.href = "home.html";
        return;
      }

      window.location.href = "exercise.html?v=20260430&id=" + encodeURIComponent(nextExerciseId);
    });

    backHomeButton.addEventListener("click", function () {
      window.location.href = "home.html";
    });

    homeButton.addEventListener("click", function () {
      window.location.href = "home.html";
    });

    progressButton.addEventListener("click", function () {
      window.location.href = "progress.html";
    });

    const profileButton = document.getElementById("profileButton");
    if (profileButton) {
      profileButton.addEventListener("click", function () {
        window.location.href = "profile.html";
      });
    }

    const navAiButton = document.getElementById("navAiButton");
    if (navAiButton) {
      navAiButton.addEventListener("click", function () {
        window.location.href = "ai-chat.html";
      });
    }
  </script>
    <script src="translations.js"></script>
  <script src="legal-footer.js"></script>
  <script src="wellora-guide.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
