<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Wellora Home</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: #fffaf6;
      --surface-strong: #ffffff;
      --text: #2b2522;
      --muted: #6f6058;
      --accent: #8d4825;
      --accent-soft: #f6ede6;
      --border: #efe4db;
      --shadow: 0 14px 30px rgba(129, 95, 74, 0.1);
      --nav-shadow: 0 -8px 22px rgba(106, 84, 67, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 8px;
      background:
        radial-gradient(circle at 95% 6%, rgba(255, 166, 127, 0.16), transparent 10%),
        linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
    }

    .screen {
      width: min(100%, 820px);
      max-width: 820px;
      min-height: 100vh;
      height: calc(100vh - env(safe-area-inset-top, 0px) - 18px);
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - 18px);
      background: linear-gradient(180deg, #fdfaf6 0%, #fbf6f0 100%);
      border: 1px solid rgba(228, 215, 205, 0.95);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 18px 42px rgba(116, 89, 71, 0.12);
      display: flex;
      flex-direction: column;
    }

    .app-shell {
      flex: 1;
      padding: 18px 18px 132px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 26px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 0 14px;
      background: linear-gradient(180deg, rgba(253, 250, 246, 0.98) 0%, rgba(253, 250, 246, 0.92) 100%);
      backdrop-filter: blur(8px);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }

    .language-control {
      display: grid;
      gap: 2px;
      min-width: 0;
      max-width: 108px;
      position: relative;
    }

    .language-control label {
      color: #8d4825;
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding-left: 2px;
    }

    .language-control::after {
      content: "";
      position: absolute;
      right: 9px;
      bottom: 14px;
      width: 6px;
      height: 6px;
      border-right: 2px solid #8d4825;
      border-bottom: 2px solid #8d4825;
      transform: rotate(45deg);
      pointer-events: none;
    }

    .language-control select {
      width: 100%;
      max-width: 108px;
      min-height: 36px;
      border-radius: 11px;
      border: 1px solid rgba(141, 72, 37, 0.18);
      background: linear-gradient(180deg, rgba(255, 252, 248, 0.98), rgba(247, 238, 229, 0.96));
      color: var(--text);
      box-shadow: 0 2px 8px rgba(116, 89, 71, 0.06);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 5px 22px 5px 9px;
      appearance: none;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .language-control select:hover,
    .language-control select:focus-visible {
      border-color: rgba(141, 72, 37, 0.36);
      box-shadow: 0 10px 20px rgba(116, 89, 71, 0.12), 0 0 0 4px rgba(141, 72, 37, 0.08);
      outline: 0;
    }

    .language-control option {
      background: #fffaf6;
      color: #2b2522;
      font-weight: 700;
    }

    .translation-note {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(255, 247, 228, 0.96);
      border: 1px solid rgba(237, 196, 122, 0.8);
      color: #6d4f35;
      font-size: 0.92rem;
      line-height: 1.5;
      font-weight: 700;
    }

    .translation-note.is-visible {
      display: block;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--accent);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .icon-button {
      width: 76px;
      height: 76px;
      border: 0;
      padding: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      color: #6b5b51;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(116, 89, 71, 0.08);
    }

    .icon-button svg {
      width: 40px;
      height: 40px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #e0d6cc;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(159, 138, 123, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .avatar svg {
      width: 42px;
      height: 42px;
      stroke: #6f5e54;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.78rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4.5vw, 2.2rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.5;
      max-width: 42ch;
    }

    .category-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .category-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      min-height: 66px;
    }

    .category-card:hover,
    .category-card:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(129, 95, 74, 0.12);
    }

    .category-card h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
      font-weight: 800;
      color: #332b27;
    }

    .category-card p {
      margin: 2px 0 0;
      font-size: 0.84rem;
      color: #6f6058;
      font-weight: 500;
    }

    .bottom-nav {
      position: sticky;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 252, 248, 0.98);
      border-top: 1px solid rgba(228, 215, 205, 0.92);
      box-shadow: var(--nav-shadow);
      padding: 6px 8px 10px;
      margin-top: auto;
      z-index: 30;
      pointer-events: auto;
    }

    .nav-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
    }

    .nav-button {
      border: 0;
      background: transparent;
      display: grid;
      justify-items: center;
      gap: 4px;
      justify-content: center;
      min-height: 44px;
      cursor: pointer;
      color: #000000;
      width: 100%;
      transition: transform 0.2s ease;
    }

    .nav-button span:last-child {
      color: #000000 !important;
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1.15;
    }

    @media (max-width: 767px) {
      .page {
        padding: 0;
      }

      .screen {
        width: 100%;
        min-height: 100dvh;
        height: 100dvh;
        max-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .app-shell {
        padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 116px);
      }

      .topbar {
        top: 0;
        padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      }

      .bottom-nav {
        bottom: 0;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="screen" aria-label="Wellora home screen">
      <div class="app-shell">
        <header class="topbar site-header">
          <div class="brand">
            <img class="brand-mark" src="image/wellora logo.png" alt="" aria-hidden="true">
            <span>Wellora</span>
          </div>

          <div class="topbar-actions">
            <div class="language-control">
              <label for="languageSelect" data-i18n="languageLabel">Language</label>
              <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="yo">Yoruba</option>
                <option value="ig">Igbo</option>
                <option value="ha">Hausa</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="zh">中文</option>
              </select>
            </div>
          </div>
        </header>

        <section class="hero">
          <p class="eyebrow" data-i18n="homeEyebrow">Today in Wellora</p>
          <h1 id="heroTitle" data-i18n="homeTitle">Your Wellness Sanctuary</h1>
          <p id="heroText">Choose a category to begin your guided journey toward vitality and peace.</p>
          <p class="translation-note" id="translationNote" aria-live="polite"></p>
        </section>

        <section class="category-grid" id="categoryGrid" aria-label="Wellness categories"></section>
      </div>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <div class="nav-list">
          <button class="nav-button is-active" type="button" aria-label="Home" data-i18n-aria-label="homeNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span data-i18n="homeNav">Home</span>
          </button>
          <button class="nav-button" type="button" aria-label="Progress" id="progressButton" data-i18n-aria-label="progressNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                <path d="M8 15v-3"></path>
                <path d="M12 15V8"></path>
                <path d="M16 15v-5"></path>
              </svg>
            </span>
            <span data-i18n="progressNav">Progress</span>
          </button>
          <button class="nav-button" type="button" id="navProfileButton" aria-label="Profile" data-i18n-aria-label="profileNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <span data-i18n="profileNav">Profile</span>
          </button>
          <button class="nav-button" type="button" aria-label="Guide" id="navGuideButton">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            </span>
            <span>Guide</span>
          </button>
          <button class="nav-button" type="button" aria-label="Ask Wellora AI" id="navAiButton" data-i18n-aria-label="aiNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>
              </svg>
            </span>
            <span data-i18n="aiNav">Wellora AI</span>
          </button>
        </div>
      </nav>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script src="translations.js"></script>
  <script src="legal-footer.js"></script>
  <script src="wellora-guide.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();

    const categoryGrid = document.getElementById("categoryGrid");
    const heroTitle = document.getElementById("heroTitle");
    const heroText = document.getElementById("heroText");
    const progressButton = document.getElementById("progressButton");
    const languageSelect = document.getElementById("languageSelect");
    const translationNote = document.getElementById("translationNote");
    const categoryConfigs = {
      "Balance and Stability": {
        chipClass: "icon-chip--emerald",
        subtitle: "Gentle chair & standing routines",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="m4 7 8-4 8 4"></path><path d="M4 17l4-9"></path><path d="M20 17l-4-9"></path><path d="M2 17h4a2 2 0 0 0 2-2V9"></path><path d="M16 9v6a2 2 0 0 0 2 2h4"></path></svg>'
      },
      "Flexibility": {
        chipClass: "icon-chip--coral",
        subtitle: "Safe daily stretches & ease",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"></circle><path d="m9 20 3-6 3 6"></path><path d="m6 11 6-3 6 3"></path></svg>'
      },
      "Mobility and Flexibility": {
        chipClass: "icon-chip--coral",
        subtitle: "Smooth movement & posture",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"></circle><path d="m9 20 3-6 3 6"></path><path d="m6 11 6-3 6 3"></path></svg>'
      },
      "Sleep and Mental Wellbeing": {
        chipClass: "icon-chip--indigo",
        subtitle: "Calming breaths & peaceful rest",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path><path d="M19 3v4"></path><path d="M21 5h-4"></path></svg>'
      },
      "Energy Levels": {
        chipClass: "icon-chip--amber",
        subtitle: "Light cardio & renewed pep",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>'
      },
      "Boosting Metabolism": {
        chipClass: "icon-chip--amber",
        subtitle: "Active circulation & warmth",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>'
      },
      "Weight Control and Metabolism": {
        chipClass: "icon-chip--amber",
        subtitle: "Healthy habits & steady pace",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 7.65l.77.78L12 21.23l7.65-7.65.77-.78a5.4 5.4 0 0 0 0-7.65Z"></path></svg>'
      },
      "Cognitive Function": {
        chipClass: "icon-chip--violet",
        subtitle: "Mental clarity & focus",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>'
      },
      "Sexual Health": {
        chipClass: "icon-chip--terracotta",
        subtitle: "Pelvic strength & comfort",
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>'
      }
    };
    let cachedCategories = [];

    function redirectToLogin() {
      window.location.href = "login.html";
    }

    function t(key, fallback) {
      return window.WelloraI18n ? window.WelloraI18n.t(key, fallback) : (fallback || key);
    }

    function localizeCategory(value) {
      return window.WelloraI18n && window.WelloraI18n.localizeCategory
        ? window.WelloraI18n.localizeCategory(value)
        : String(value || "");
    }

    function updateTranslationNotice() {
      const language = window.WelloraI18n ? window.WelloraI18n.getLanguage() : "en";
      const notice = t("translationNotice", "");
      translationNote.textContent = notice;
      translationNote.classList.toggle("is-visible", language !== "en" && Boolean(notice));
    }

    function renderHomeCopy() {
      heroTitle.textContent = t("homeTitle", "Your Wellness Sanctuary");
      heroText.textContent = cachedCategories.length
        ? t("homeTextReady", "Choose a category and start a gentle routine designed to keep your momentum going.")
        : t("homeTextEmpty", "Your home screen is ready. Add your first exercise to begin building a calm daily routine.");
      updateTranslationNotice();
    }

    function renderCategories(categories) {
      const uniqueCategories = [...new Map(categories.map(item => [item.category, item])).values()];

      const markup = uniqueCategories.map(function (category) {
        const catName = category.category;
        const config = categoryConfigs[catName] || {
          chipClass: "icon-chip--terracotta",
          subtitle: t("openCategory", "Explore gentle routines"),
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>'
        };

        return (
          '<button class="category-card" type="button" data-category="' + encodeURIComponent(catName) + '">' +
          '<div class="icon-chip ' + config.chipClass + '" aria-hidden="true">' +
          config.svg +
          "</div>" +
          '<div class="category-info">' +
          '<h2 class="category-title">' + localizeCategory(catName) + "</h2>" +
          '<p class="category-subtitle">' + config.subtitle + "</p>" +
          "</div>" +
          '<svg class="category-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>' +
          "</button>"
        );
      }).join("");

      categoryGrid.innerHTML = markup || (
        '<article class="category-card" aria-live="polite">' +
        "<h2>" + t("noCategoriesTitle", "No categories available") + "</h2>" +
        "<p>" + t("noCategoriesText", "Add exercises in Supabase to populate this screen.") + "</p>" +
        "</article>"
      );
    }

    async function requireUser() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data || !data.user) {
        redirectToLogin();
        return null;
      }

      return data.user;
    }

    async function loadCategories() {
      const { data, error } = await supabaseClient
        .from("EXERCISES")
        .select("category");

      if (error) {
        throw error;
      }

      return data || [];
    }

    function attachNavigation() {
      categoryGrid.addEventListener("click", function (event) {
        const button = event.target.closest(".category-card");

        if (!button || !button.dataset.category) {
          return;
        }

        window.WelloraFlow.rememberLastCategory(decodeURIComponent(button.dataset.category));
        window.location.href = "category.html?category=" + button.dataset.category;
      });

      progressButton.addEventListener("click", function () {
        window.location.href = "progress.html";
      });

      const navProfileButton = document.getElementById("navProfileButton");
      if (navProfileButton) {
        navProfileButton.addEventListener("click", function () {
          window.location.href = "profile.html";
        });
      }

      const navAiButton = document.getElementById("navAiButton");
      if (navAiButton) {
        navAiButton.addEventListener("click", function () {
          window.location.href = "ai-chat.html";
        });
      }
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if ((event === "SIGNED_OUT" || !session) && !window.location.pathname.endsWith("login.html")) {
        redirectToLogin();
      }
    });

    async function init() {
      attachNavigation();
      window.WelloraI18n.initLanguageSelector(languageSelect);
      window.WelloraI18n.applyTranslations(document);
      updateTranslationNotice();

      window.addEventListener("wellora:languagechange", function () {
        window.WelloraI18n.applyTranslations(document);
        renderHomeCopy();
        renderCategories(cachedCategories);
      });

      const user = await requireUser();

      if (!user) {
        return;
      }

      try {
        const categories = await loadCategories();
        cachedCategories = categories;
        renderHomeCopy();
        renderCategories(cachedCategories);
      } catch (error) {
        categoryGrid.innerHTML =
          '<article class="category-card" aria-live="polite">' +
          "<h2>Couldn't load categories</h2>" +
          "<p>" + (error.message || "Please check your Supabase setup.") + "</p>" +
          "</article>";
      }
    }

    init();
  </script>
  <script src="/pwa.js"></script>
</body>

</html>
