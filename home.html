<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Wellora Home</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: #fffaf6;
      --surface-strong: #ffffff;
      --text: #2b2522;
      --muted: #6f6058;
      --accent: #8d4825;
      --accent-soft: #f6ede6;
      --border: #efe4db;
      --shadow: 0 14px 30px rgba(129, 95, 74, 0.1);
      --nav-shadow: 0 -8px 22px rgba(106, 84, 67, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 8px;
      background:
        radial-gradient(circle at 95% 6%, rgba(255, 166, 127, 0.16), transparent 10%),
        linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
    }

    .screen {
      width: min(100%, 390px);
      min-height: 100vh;
      height: calc(100vh - env(safe-area-inset-top, 0px) - 18px);
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - 18px);
      background: linear-gradient(180deg, #fdfaf6 0%, #fbf6f0 100%);
      border: 1px solid rgba(228, 215, 205, 0.95);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 18px 42px rgba(116, 89, 71, 0.12);
      display: flex;
      flex-direction: column;
    }

    .app-shell {
      flex: 1;
      padding: 18px 18px 132px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 26px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 0 14px;
      background: linear-gradient(180deg, rgba(253, 250, 246, 0.98) 0%, rgba(253, 250, 246, 0.92) 100%);
      backdrop-filter: blur(8px);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-control {
      display: grid;
      gap: 5px;
      min-width: 138px;
      position: relative;
    }

    .language-control label {
      color: #8d4825;
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-left: 4px;
    }

    .language-control::after {
      content: "";
      position: absolute;
      right: 14px;
      bottom: 15px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #8d4825;
      border-bottom: 2px solid #8d4825;
      transform: rotate(45deg);
      pointer-events: none;
    }

    .language-control select {
      min-height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(141, 72, 37, 0.18);
      background: linear-gradient(180deg, rgba(255, 252, 248, 0.98), rgba(247, 238, 229, 0.96));
      color: var(--text);
      box-shadow: 0 8px 18px rgba(116, 89, 71, 0.08);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 9px 36px 9px 16px;
      appearance: none;
      cursor: pointer;
    }

    .language-control select:hover,
    .language-control select:focus-visible {
      border-color: rgba(141, 72, 37, 0.36);
      box-shadow: 0 10px 20px rgba(116, 89, 71, 0.12), 0 0 0 4px rgba(141, 72, 37, 0.08);
      outline: 0;
    }

    .language-control option {
      background: #fffaf6;
      color: #2b2522;
      font-weight: 700;
    }

    .translation-note {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(255, 247, 228, 0.96);
      border: 1px solid rgba(237, 196, 122, 0.8);
      color: #6d4f35;
      font-size: 0.92rem;
      line-height: 1.5;
      font-weight: 700;
    }

    .translation-note.is-visible {
      display: block;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--accent);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .icon-button {
      width: 76px;
      height: 76px;
      border: 0;
      padding: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      color: #6b5b51;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(116, 89, 71, 0.08);
    }

    .icon-button svg {
      width: 40px;
      height: 40px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #e0d6cc;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(159, 138, 123, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .avatar svg {
      width: 42px;
      height: 42px;
      stroke: #6f5e54;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.82rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-size: 2.65rem;
      line-height: 0.98;
      letter-spacing: -0.07em;
      font-weight: 800;
    }

    .hero p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      max-width: 300px;
    }

    .category-grid {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 12px;
    }

    .category-card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 14px 16px;
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      min-height: 112px;
    }

    .category-card:hover,
    .category-card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(129, 95, 74, 0.14);
    }

    .category-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #f5eee7;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
    }

    .category-icon img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .category-card h2 {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.25;
      letter-spacing: -0.03em;
      font-weight: 800;
      color: #332b27;
    }

    .category-card p {
      margin: 6px 0 0;
      font-size: 0.72rem;
      color: #a08f84;
      font-weight: 700;
    }

    .featured-card {
      margin-top: 28px;
      border: 0;
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      min-height: 180px;
      cursor: pointer;
      background: linear-gradient(145deg, #fff0e6 0%, #f8ede4 45%, #f3e7de 100%);
      box-shadow: 0 18px 34px rgba(141, 77, 44, 0.12);
      padding: 24px 20px;
      display: flex;
      align-items: stretch;
      text-align: left;
      border: 1px solid rgba(221, 195, 176, 0.75);
      gap: 12px;
      isolation: isolate;
    }

    .featured-card::before {
      content: "";
      position: absolute;
      width: 148px;
      height: 148px;
      right: -34px;
      top: -28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 240, 230, 0.18) 72%, transparent 73%);
      z-index: 0;
    }

    .featured-card::after {
      content: "";
      position: absolute;
      width: 112px;
      height: 112px;
      left: -26px;
      bottom: -34px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 221, 206, 0.95) 0%, rgba(244, 221, 206, 0.22) 70%, transparent 71%);
      z-index: 0;
    }

    .featured-content {
      position: relative;
      z-index: 1;
      color: #3e2d24;
      display: grid;
      gap: 12px;
      width: 100%;
      align-content: start;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: start;
      gap: 8px;
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(141, 72, 37, 0.92);
      color: #fff7f1;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 10px 18px rgba(141, 72, 37, 0.16);
    }

    .pill::before {
      content: "\2728";
      font-size: 0.95rem;
      line-height: 1;
    }

    .pill.is-beginner,
    .pill[data-level="beginner"],
    .pill[data-difficulty="beginner"] {
      background: #5ea66b;
      color: #ffffff;
    }

    .pill.is-intermediate,
    .pill[data-level="intermediate"],
    .pill[data-difficulty="intermediate"] {
      background: #de7d3a;
      color: #ffffff;
    }

    .featured-content h3 {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.18;
      letter-spacing: -0.04em;
      font-weight: 800;
      color: #4c3429;
    }

    .featured-content p {
      margin: 0;
      font-size: 0.95rem;
      color: #7d685c;
      line-height: 1.6;
      max-width: 26ch;
    }

    .featured-card button,
    .featured-card .button,
    .featured-card .primary-button,
    .featured-card .secondary-button {
      width: 100%;
      min-height: 48px;
      border-radius: 18px;
      background: #8d4d2c;
      color: #ffffff;
      padding: 14px;
      border: 0;
      font-weight: 800;
      box-shadow: 0 12px 22px rgba(141, 77, 44, 0.16);
    }

    @media (max-width: 640px) {
      .featured-card {
        padding: 24px 20px;
      }

      .featured-card button,
      .featured-card .button,
      .featured-card .primary-button,
      .featured-card .secondary-button {
        width: 100%;
      }
    }

    .bottom-nav {
      position: sticky;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 252, 248, 0.98);
      border-top: 1px solid rgba(228, 215, 205, 0.92);
      box-shadow: var(--nav-shadow);
      padding: 10px 10px 14px;
      animation: navRise 0.45s ease-out;
      margin-top: auto;
      z-index: 30;
      pointer-events: auto;
    }

    .nav-list {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .nav-button {
      border: 0;
      background: transparent;
      display: grid;
      justify-items: center;
      gap: 6px;
      justify-content: center;
      min-height: 44px;
      cursor: pointer;
      color: #9a887d;
      width: 100%;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .nav-button svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .nav-button.is-active {
      color: var(--accent);
    }

    .nav-button span:last-child {
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .nav-pill {
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: transparent;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-button.is-active .nav-pill {
      background: var(--accent);
      color: #fff7f1;
      animation: activeNavBob 3s ease-in-out infinite;
      box-shadow: 0 8px 16px rgba(141, 72, 37, 0.18);
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      transform: translateY(-1px);
    }

    .nav-button:hover .nav-pill,
    .nav-button:focus-visible .nav-pill {
      transform: translateY(-2px);
    }

    .nav-button:hover svg,
    .nav-button:focus-visible svg {
      transform: scale(1.05);
    }

    @keyframes navRise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes activeNavBob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @media (max-width: 767px) {
      .page {
        padding: 0;
      }

      .screen {
        width: 100%;
        min-height: 100dvh;
        height: 100dvh;
        max-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .app-shell {
        padding: 0 18px calc(env(safe-area-inset-bottom, 0px) + 132px);
      }

      .topbar {
        top: 0;
        padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      }

      .bottom-nav {
        bottom: 0;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      }
    }

    @media (min-width: 480px) {
      .screen {
        width: 400px;
        height: calc(100vh - 36px);
        max-height: calc(100vh - 36px);
      }

      .app-shell {
        padding: 20px 20px 108px;
      }

      .hero h1 {
        font-size: 2.85rem;
      }
    }

    @media (min-width: 768px) {
      .page {
        padding: 18px;
      }

      .screen {
        width: 414px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="screen" aria-label="Wellora home screen">
      <div class="app-shell">
        <header class="topbar site-header">
          <div class="brand">
            <img class="brand-mark" src="image/wellora logo.png" alt="" aria-hidden="true">
            <span>Wellora</span>
          </div>

          <div class="topbar-actions">
            <div class="language-control">
              <label for="languageSelect" data-i18n="languageLabel">Language</label>
              <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="yo">Yoruba</option>
                <option value="ig">Igbo</option>
                <option value="ha">Hausa</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="zh">中文</option>
              </select>
            </div>

            <button class="icon-button" type="button" aria-label="Profile" id="profileButton"
              data-i18n-aria-label="profileNav">
              <span class="avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
                  <path d="M4 20a8 8 0 0 1 16 0"></path>
                </svg>
              </span>
            </button>
          </div>
        </header>

        <section class="hero">
          <p class="eyebrow" data-i18n="homeEyebrow">Today in Wellora</p>
          <h1 id="heroTitle" data-i18n="homeTitle">Your Wellness Sanctuary</h1>
          <p id="heroText">Choose a category to begin your guided journey toward vitality and peace.</p>
          <p class="translation-note" id="translationNote" aria-live="polite"></p>
        </section>

        <section class="category-grid" id="categoryGrid" aria-label="Wellness categories"></section>

        <button class="featured-card" type="button" id="featuredExerciseButton" data-exercise-id="">
          <div class="featured-content">
            <span class="pill" id="featuredPill" data-i18n="recommended">Recommended</span>
            <h3 id="featuredTitle" data-i18n="loadingFeatured">Loading featured exercise...</h3>
            <p id="featuredDescription" data-i18n="fetchingFeatured">Fetching today's guided movement from your library.
            </p>
          </div>
        </button>
      </div>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <div class="nav-list">
          <button class="nav-button is-active" type="button" aria-label="Home" data-i18n-aria-label="homeNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path d="M10 20V14H14V20H19V12H22L12 3L2 12H5V20H10Z"></path>
              </svg>
            </span>
            <span data-i18n="homeNav">Home</span>
          </button>
          <button class="nav-button" type="button" aria-label="Progress" id="progressButton"
            data-i18n-aria-label="progressNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path
                  d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM9 17H7V10H9V17ZM13 17H11V7H13V17ZM17 17H15V13H17V17Z">
                </path>
              </svg>
            </span>
            <span data-i18n="progressNav">Progress</span>
          </button>
          <button class="nav-button" type="button" aria-label="Voice Help" id="navVoiceButton">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"></path>
                <path d="M19 11a7 7 0 0 1-14 0"></path>
                <path d="M12 18v3"></path>
                <path d="M8 21h8"></path>
              </svg>
            </span>
            <span>Voice</span>
          </button>
          <button class="nav-button" type="button" aria-label="Guide" id="navGuideButton">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z">
                </path>
              </svg>
            </span>
            <span>Guide</span>
          </button>
          <button class="nav-button" type="button" aria-label="Ask Wellora AI" id="navAiButton"
            data-i18n-aria-label="aiNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-9 12-1.5-3.5L6 9l3.5-1.5L11 4l1.5 3.5L16 9l-3.5 1.5L11 14zm6-2-.75-1.75L14.5 9.5l1.75-.75L17 7l.75 1.75 1.75.75-1.75.75L17 12z"></path>
              </svg>
            </span>
            <span data-i18n="aiNav">Ask Wellora AI</span>
          </button>
          <button class="nav-button" type="button" aria-label="Profile" id="navProfileButton"
            data-i18n-aria-label="profileNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z">
                </path>
              </svg>
            </span>
            <span data-i18n="profileNav">Profile</span>
          </button>
        </div>
      </nav>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script src="translations.js"></script>
  <script src="legal-footer.js"></script>
  <script src="wellora-guide.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();

    const categoryGrid = document.getElementById("categoryGrid");
    const featuredExerciseButton = document.getElementById("featuredExerciseButton");
    const featuredTitle = document.getElementById("featuredTitle");
    const featuredDescription = document.getElementById("featuredDescription");
    const featuredPill = document.getElementById("featuredPill");
    const heroTitle = document.getElementById("heroTitle");
    const heroText = document.getElementById("heroText");
    const profileButton = document.getElementById("profileButton");
    const navProfileButton = document.getElementById("navProfileButton");
    const progressButton = document.getElementById("progressButton");
    const languageSelect = document.getElementById("languageSelect");
    const translationNote = document.getElementById("translationNote");
    const categoryIcons = {
      "Balance and Stability": "image/balance and stability icon.png",
      "Flexibility": "image/flexibility.png",
      "Weight Control and Metabolism": "image/weight and control metabolism.png",
      "Boosting Metabolism": "image/bosting metabolism.png",
      "Sexual Health": "image/sexual health.png",
      "Mobility and Flexibility": "image/mobility and flexibility.png",
      "Sleep and Mental Wellbeing": "image/sleep and mental wellbeing.png",
      "Energy Levels": "image/energy levels.png",
      "Cognitive Function": "image/cognitive function.png"
    };
    let cachedCategories = [];
    let cachedExercises = [];

    function redirectToLogin() {
      window.location.href = "login.html";
    }

    function formatMinutes(seconds) {
      const totalSeconds = Number(seconds);

      if (!Number.isFinite(totalSeconds) || totalSeconds <= 0) {
        return "a guided routine";
      }

      const minutes = Math.max(1, Math.round(totalSeconds / 60));
      return minutes + "-minute routine";
    }

    function t(key, fallback) {
      return window.WelloraI18n ? window.WelloraI18n.t(key, fallback) : (fallback || key);
    }

    function updateTranslationNotice() {
      const language = window.WelloraI18n ? window.WelloraI18n.getLanguage() : "en";
      const notice = t("translationNotice", "");
      translationNote.textContent = notice;
      translationNote.classList.toggle("is-visible", language !== "en" && Boolean(notice));
    }

    function renderHomeCopy() {
      heroTitle.textContent = t("homeTitle", "Your Wellness Sanctuary");
      heroText.textContent = cachedExercises.length
        ? t("homeTextReady", "Choose a category and start a gentle routine designed to keep your momentum going.")
        : t("homeTextEmpty", "Your home screen is ready. Add your first exercise to begin building a calm daily routine.");
      updateTranslationNotice();
    }

    function renderCategories(categories) {
      const uniqueCategories = [...new Map(categories.map(item => [item.category, item])).values()];

      const markup = uniqueCategories.map(function (category) {
        const icon = categoryIcons[category.category] || "image/wellora logo.png";

        return (
          '<button class="category-card" type="button" data-category="' + encodeURIComponent(category.category) + '">' +
          '<span class="category-icon" aria-hidden="true">' +
          '<img src="' + icon + '" alt="">' +
          "</span>" +
          "<h2>" + category.category + "</h2>" +
          "<p>" + t("openCategory", "Open category") + "</p>" +
          "</button>"
        );
      }).join("");

      categoryGrid.innerHTML = markup || (
        '<article class="category-card" aria-live="polite">' +
        "<h2>" + t("noCategoriesTitle", "No categories available") + "</h2>" +
        "<p>" + t("noCategoriesText", "Add exercises in Supabase to populate this screen.") + "</p>" +
        "</article>"
      );
    }

    function renderFeatured(exercises) {
      if (!exercises.length) {
        featuredExerciseButton.dataset.exerciseId = "";
        featuredExerciseButton.dataset.category = "";
        featuredTitle.textContent = t("noFeaturedTitle", "No featured exercise yet");
        featuredDescription.textContent = t("noFeaturedText", "Add an exercise in Supabase and it will appear here.");
        featuredPill.textContent = t("libraryEmpty", "Library Empty");
        return;
      }

      const featuredExercise = exercises[0];
      featuredExerciseButton.dataset.exerciseId = String(featuredExercise.id);
      featuredExerciseButton.dataset.category = featuredExercise.category || "";
      featuredTitle.textContent = featuredExercise.exercise_name || "Featured exercise";
      featuredDescription.textContent =
        formatMinutes(featuredExercise.duration_seconds) +
        " in " +
        (featuredExercise.category || "your movement library");
      featuredPill.textContent = featuredExercise.category || "Recommended";
    }

    async function requireUser() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data || !data.user) {
        redirectToLogin();
        return null;
      }

      return data.user;
    }

    async function loadCategories() {
      const { data, error } = await supabaseClient
        .from("EXERCISES")
        .select("category");

      if (error) {
        throw error;
      }

      return data || [];
    }

    async function loadExercises() {
      const { data, error } = await supabaseClient
        .from("EXERCISES")
        .select("id, exercise_name, category, duration_seconds")
        .order("category", { ascending: true })
        .order("exercise_name", { ascending: true });

      if (error) {
        throw error;
      }

      return data || [];
    }

    function attachNavigation() {
      categoryGrid.addEventListener("click", function (event) {
        const button = event.target.closest(".category-card");

        if (!button || !button.dataset.category) {
          return;
        }

        window.WelloraFlow.rememberLastCategory(decodeURIComponent(button.dataset.category));
        window.location.href = "category.html?category=" + button.dataset.category;
      });

      featuredExerciseButton.addEventListener("click", function () {
        const targetExerciseId = featuredExerciseButton.dataset.exerciseId;

        if (!targetExerciseId) {
          return;
        }

        if (featuredExerciseButton.dataset.category) {
          window.WelloraFlow.rememberLastCategory(featuredExerciseButton.dataset.category);
        }

        window.location.href = "exercise.html?id=" + encodeURIComponent(targetExerciseId);
      });

      profileButton.addEventListener("click", function () {
        window.location.href = "profile.html";
      });

      navProfileButton.addEventListener("click", function () {
        window.location.href = "profile.html";
      });

      progressButton.addEventListener("click", function () {
        window.location.href = "progress.html";
      });

      const navAiButton = document.getElementById("navAiButton");
      if (navAiButton) {
        navAiButton.addEventListener("click", function () {
          window.location.href = "ai-chat.html";
        });
      }
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if ((event === "SIGNED_OUT" || !session) && !window.location.pathname.endsWith("login.html")) {
        redirectToLogin();
      }
    });

    async function init() {
      attachNavigation();
      window.WelloraI18n.initLanguageSelector(languageSelect);
      window.WelloraI18n.applyTranslations(document);
      updateTranslationNotice();

      window.addEventListener("wellora:languagechange", function () {
        window.WelloraI18n.applyTranslations(document);
        renderHomeCopy();
        renderCategories(cachedCategories);
        renderFeatured(cachedExercises);
      });

      const user = await requireUser();

      if (!user) {
        return;
      }

      try {
        const categories = await loadCategories();
        const exercises = await loadExercises();
        cachedCategories = categories;
        cachedExercises = exercises;
        renderHomeCopy();
        renderCategories(cachedCategories);
        renderFeatured(cachedExercises);
      } catch (error) {
        categoryGrid.innerHTML =
          '<article class="category-card" aria-live="polite">' +
          "<h2>Couldn't load categories</h2>" +
          "<p>" + (error.message || "Please check your Supabase setup.") + "</p>" +
          "</article>";
        featuredExerciseButton.dataset.exerciseId = "";
        featuredExerciseButton.dataset.category = "";
        featuredTitle.textContent = t("backendUnavailable", "Backend unavailable");
        featuredDescription.textContent = t("backendUnavailableText", "We couldn't load exercises from Supabase right now.");
        featuredPill.textContent = t("connectionError", "Connection Error");
      }
    }

    init();
  </script>
  <script src="voice-control.js"></script>
  <script src="/pwa.js"></script>
</body>

</html>
