<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellora Reset Password</title>
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: rgba(255, 255, 255, 0.95);
      --text: #26201c;
      --muted: #6f6057;
      --accent: #8a4926;
      --border: rgba(232, 221, 213, 0.95);
      --shadow: 0 18px 40px rgba(125, 94, 72, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.98), transparent 20%),
        radial-gradient(circle at 100% 0, rgba(238, 213, 193, 0.28), transparent 18%),
        linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 8px;
    }

    .screen {
      width: min(100%, 390px);
      min-height: 100vh;
      background: linear-gradient(180deg, #fdfaf7 0%, #fbf6f0 100%);
      border-left: 1px solid rgba(228, 215, 205, 0.95);
      border-right: 1px solid rgba(228, 215, 205, 0.95);
      box-shadow: 0 18px 42px rgba(116, 89, 71, 0.12);
      position: relative;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 24px 22px;
      color: var(--accent);
      border-bottom: 1px solid rgba(232, 221, 213, 0.7);
    }

    .icon-button,
    .primary-button,
    .text-button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .icon-button svg,
    .input-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .content {
      padding: 22px 24px 36px;
    }

    .hero-image {
      height: 212px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background:
        radial-gradient(circle at 18% 14%, #b8b2ab 0 16%, transparent 16.2%),
        radial-gradient(circle at 34% 12%, #8e857d 0 18%, transparent 18.2%),
        radial-gradient(circle at 55% 10%, #aaa297 0 18%, transparent 18.2%),
        radial-gradient(circle at 77% 14%, #837b73 0 12%, transparent 12.2%),
        radial-gradient(circle at 92% 16%, #9a9187 0 14%, transparent 14.2%),
        radial-gradient(circle at 8% 36%, #969087 0 16%, transparent 16.2%),
        radial-gradient(circle at 28% 42%, #ada59b 0 12%, transparent 12.2%),
        radial-gradient(circle at 50% 38%, #8a8178 0 18%, transparent 18.2%),
        radial-gradient(circle at 71% 39%, #9e968b 0 12%, transparent 12.2%),
        radial-gradient(circle at 88% 41%, #7c746c 0 16%, transparent 16.2%),
        radial-gradient(circle at 15% 62%, #b4aca1 0 15%, transparent 15.2%),
        radial-gradient(circle at 39% 68%, #978d84 0 18%, transparent 18.2%),
        radial-gradient(circle at 67% 66%, #b2aaa0 0 13%, transparent 13.2%),
        radial-gradient(circle at 88% 70%, #8f877e 0 18%, transparent 18.2%),
        radial-gradient(circle at 26% 88%, #a79f95 0 14%, transparent 14.2%),
        radial-gradient(circle at 58% 88%, #8a837a 0 14%, transparent 14.2%),
        linear-gradient(135deg, #1f1b18 0%, #26211d 40%, #120f0d 100%);
    }

    .hero {
      margin-top: 34px;
    }

    .hero h1 {
      margin: 0;
      font-size: 3rem;
      line-height: 0.96;
      letter-spacing: -0.085em;
      font-weight: 800;
      max-width: 320px;
    }

    .hero p {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
      max-width: 300px;
    }

    .form {
      margin-top: 28px;
      display: grid;
      gap: 22px;
    }

    .field-group {
      display: grid;
      gap: 10px;
    }

    .field-label {
      color: #67584f;
      font-size: 0.88rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .input-shell {
      min-height: 62px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.52);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      box-shadow: 0 10px 22px rgba(154, 123, 97, 0.08);
    }

    .input-shell:focus-within {
      border-color: rgba(138, 73, 38, 0.45);
      box-shadow: 0 0 0 4px rgba(138, 73, 38, 0.1);
    }

    .input-icon {
      width: 22px;
      height: 22px;
      color: #a38f82;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }

    .input::placeholder {
      color: #a38f82;
    }

    .primary-button {
      width: 100%;
      min-height: 60px;
      border-radius: 18px;
      background: linear-gradient(180deg, #8c4b28 0%, #783c1d 100%);
      color: #fffaf5;
      font-size: 1.02rem;
      font-weight: 800;
      box-shadow: 0 14px 24px rgba(133, 73, 39, 0.24);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .primary-button svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .back-login {
      margin-top: 36px;
      text-align: center;
    }

    .text-button {
      color: var(--accent);
      font-size: 0.98rem;
      font-weight: 800;
    }

    .support {
      margin-top: 60px;
      text-align: center;
    }

    .support-label {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #a18f84;
      font-size: 0.88rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      justify-content: center;
    }

    .support-label::before,
    .support-label::after {
      content: "";
      width: 96px;
      height: 1px;
      background: rgba(212, 197, 186, 0.9);
    }

    .support p {
      margin: 20px auto 0;
      max-width: 300px;
      color: #72645c;
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .pager {
      margin-top: 86px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e5d8cf;
    }

    .dot.is-active {
      background: #d1b7a9;
    }

    @media (max-width: 360px) {
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .hero h1 {
        font-size: 2.55rem;
      }
    }

    @media (min-width: 768px) {
      .page {
        padding: 18px;
      }

      .screen {
        width: 414px;
        border: 1px solid rgba(228, 215, 205, 0.95);
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="screen" aria-label="Reset password screen">
      <header class="header">
        <button class="icon-button" type="button" id="backButton" aria-label="Go back">
          <svg viewBox="0 0 24 24">
            <path d="M15 18 9 12l6-6"></path>
          </svg>
        </button>
        <h1 class="header-title">Reset Password</h1>
      </header>

      <div class="content">
        <div class="hero-image" aria-hidden="true"></div>

        <section class="hero">
          <h1>Recover your access</h1>
          <p>Enter your email address and we'll send you a link to reset your password.</p>
        </section>

        <form class="form" id="resetForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="resetEmail">Email Address</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 6h16v12H4z"></path>
                  <path d="m4 7 8 6 8-6"></path>
                </svg>
              </span>
              <input class="input" type="email" id="resetEmail" name="email" placeholder="name@example.com" autocomplete="email" required>
            </div>
          </div>

          <button class="primary-button" type="submit">
            <span>Send reset link</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </button>
        </form>

        <div class="back-login">
          <button class="text-button" type="button" id="backToLoginButton">Back to login</button>
        </div>

        <section class="support" aria-label="Need support">
          <div class="support-label">Need Support?</div>
          <p>If you're having trouble receiving the code, please check your spam folder or contact our wellness concierge.</p>
        </section>

        <div class="pager" aria-hidden="true">
          <span class="dot is-active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();
    const resetForm = document.getElementById("resetForm");
    const resetEmail = document.getElementById("resetEmail");
    const backButton = document.getElementById("backButton");
    const backToLoginButton = document.getElementById("backToLoginButton");

    function getBaseUrl() {
      return window.location.origin + window.location.pathname.replace(/[^/]*$/, "");
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = resetEmail.value.trim();

      if (!email) {
        window.alert("Please enter your email address.");
        return;
      }

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: getBaseUrl() + "login.html"
        });

        if (error) {
          throw error;
        }

        localStorage.setItem("welloraResetEmail", email);
        window.location.href = "reset-password-sent.html?email=" + encodeURIComponent(email);
      } catch (error) {
        window.alert(error.message || "We couldn't send the reset email. Please try again.");
      }
    });

    backButton.addEventListener("click", function () {
      window.location.href = "login.html";
    });

    backToLoginButton.addEventListener("click", function () {
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
