<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Wellora Profile</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: rgba(255, 255, 255, 0.95);
      --surface-soft: #f3ede8;
      --text: #26201c;
      --muted: #7d6c62;
      --accent: #864624;
      --accent-dark: #6f381b;
      --border: rgba(232, 221, 213, 0.95);
      --shadow: 0 18px 40px rgba(125, 94, 72, 0.1);
      --nav-shadow: 0 -10px 24px rgba(106, 84, 67, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.98), transparent 20%),
        radial-gradient(circle at 100% 0, rgba(238, 213, 193, 0.28), transparent 18%),
        linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 8px;
    }

    .screen {
      width: min(100%, 390px);
      min-height: 100vh;
      height: calc(100vh - env(safe-area-inset-top, 0px) - 18px);
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - 18px);
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #fdfaf7 0%, #fbf6f0 100%);
      border-left: 1px solid rgba(228, 215, 205, 0.95);
      border-right: 1px solid rgba(228, 215, 205, 0.95);
      box-shadow: 0 18px 42px rgba(116, 89, 71, 0.12);
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      padding: 24px 24px 132px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--accent-dark);
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 0 14px;
      background: linear-gradient(180deg, rgba(253, 250, 246, 0.98) 0%, rgba(253, 250, 246, 0.92) 100%);
      backdrop-filter: blur(8px);
    }

    .topbar-side {
      width: 48px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-button,
    .nav-button,
    .edit-chip,
    .logout-button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .icon-button,
    .nav-button {
      display: grid;
      place-items: center;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 8px 16px rgba(125, 94, 72, 0.08);
    }

    .icon-button svg,
    .avatar-edit svg,
    .detail-arrow svg,
    .pref-icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-button svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .topbar-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      flex: 1;
    }

    .hero {
      padding-top: 20px;
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 128px;
      margin: 0 auto;
    }

    .avatar-shell {
      position: relative;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: #e0d6cc;
      border: 4px solid rgba(255, 255, 255, 0.9);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      color: #6f5e54;
    }

    .avatar-shell::before {
      content: none;
    }

    .avatar-shell::after {
      content: none;
    }

    .avatar-placeholder-icon {
      width: 72px;
      height: 72px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .avatar-initials {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .avatar-edit {
      position: absolute;
      right: 2px;
      bottom: 4px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #fffaf5;
      display: grid;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 20px rgba(134, 70, 36, 0.24);
      cursor: pointer;
    }

    .profile-name {
      margin: 18px 0 0;
      font-size: 2.05rem;
      line-height: 1.05;
      letter-spacing: -0.07em;
      font-weight: 800;
    }

    .profile-email {
      margin: 10px 0 0;
      color: #63544c;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .section {
      margin-top: 42px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .edit-chip {
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 700;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .details-card {
      padding: 12px;
      background:
        linear-gradient(180deg, rgba(255, 250, 245, 0.98), rgba(247, 240, 233, 0.96));
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      text-align: left;
      width: 100%;
      border-radius: 20px;
      background: linear-gradient(180deg, #fffaf6 0%, #f7eee6 100%);
      border: 1px solid rgba(216, 192, 177, 0.92);
      box-shadow: 0 10px 20px rgba(125, 94, 72, 0.08);
      color: var(--text);
    }

    .detail-row + .detail-row {
      margin-top: 12px;
    }

    .detail-row:hover,
    .detail-row:focus-visible {
      background: linear-gradient(180deg, #fffdf9 0%, #f6ece3 100%);
      border-color: rgba(173, 124, 92, 0.95);
      transform: translateY(-1px);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .detail-label {
      margin: 0;
      color: #7b5f50;
      font-size: 0.76rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .detail-value {
      margin: 8px 0 0;
      font-size: 1.08rem;
      line-height: 1.45;
      font-weight: 800;
      color: #2d221c;
    }

    .detail-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      width: 100%;
    }

    .detail-content {
      min-width: 0;
      flex: 1;
    }

    .goal-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
      padding: 4px;
      border-radius: 10px;
      background: rgba(141, 77, 44, 0.1);
    }

    .detail-arrow {
      color: #8f5f43;
      background: rgba(141, 77, 44, 0.1);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .preferences-card {
      padding: 8px 0;
    }

    .pref-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 16px 22px;
    }

    .pref-row + .pref-row {
      border-top: 1px solid rgba(238, 229, 222, 0.85);
    }

    .pref-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #eee8e3;
      color: var(--accent);
      display: grid;
      place-items: center;
    }

    .pref-label {
      font-size: 0.98rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 32px;
      display: inline-block;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #e2ddd8;
      transition: background 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 4px;
      top: 4px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(67, 45, 31, 0.12);
      transition: transform 0.2s ease;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(24px);
    }

    .account-block {
      margin-top: 42px;
    }

    .logout-button {
      width: 100%;
      min-height: 56px;
      border-radius: 20px;
      border: 2px solid rgba(134, 70, 36, 0.9);
      color: var(--accent);
      font-size: 1rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.25);
    }

    .secondary-button {
      width: 100%;
      min-height: 56px;
      border-radius: 20px;
      border: 1px solid rgba(134, 70, 36, 0.16);
      color: var(--accent-dark);
      font-size: 1rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 10px 20px rgba(125, 94, 72, 0.08);
      margin-bottom: 14px;
    }

    .version {
      margin: 18px 0 0;
      text-align: center;
      color: #a18d81;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .bottom-nav {
      position: sticky;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 252, 248, 0.98);
      border-top: 1px solid rgba(228, 215, 205, 0.92);
      box-shadow: var(--nav-shadow);
      padding: 12px 18px 16px;
      animation: navRise 0.45s ease-out;
      margin-top: auto;
      z-index: 30;
      pointer-events: auto;
    }

    .nav-list {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .nav-button {
      color: #ab9b90;
      justify-items: center;
      gap: 6px;
      width: 100%;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .nav-pill {
      width: 100%;
      min-height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-button span {
      font-size: 0.8rem;
      line-height: 1.2;
    }

    .nav-button.is-active {
      color: var(--accent);
    }

    .nav-button.is-active .nav-pill {
      background: #ede6df;
      animation: activeNavBob 3s ease-in-out infinite;
      box-shadow: 0 8px 16px rgba(134, 70, 36, 0.12);
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      transform: translateY(-1px);
    }

    .nav-button:hover .nav-pill,
    .nav-button:focus-visible .nav-pill {
      transform: translateY(-2px);
    }

    .nav-button:hover svg,
    .nav-button:focus-visible svg {
      transform: scale(1.05);
    }

    @keyframes navRise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes activeNavBob {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    .large-text {
      font-size: 18px;
    }

    .large-text .profile-name {
      font-size: 2.35rem;
    }

    .large-text .section-head h2,
    .large-text .pref-label,
    .large-text .detail-value,
    .large-text .logout-button,
    .large-text .secondary-button {
      font-size: 1.06rem;
    }

    @media (max-width: 360px) {
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .profile-name {
        font-size: 1.85rem;
      }
    }

    @media (max-width: 767px) {
      .page {
        padding: 0;
      }

      .screen {
        width: 100%;
        min-height: 100dvh;
        height: 100dvh;
        max-height: 100dvh;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }

      .content {
        padding: 0 24px calc(env(safe-area-inset-bottom, 0px) + 132px);
      }

      .topbar {
        top: 0;
        padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      }

      .bottom-nav {
        bottom: 0;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      }
    }

    @media (min-width: 768px) {
      .page {
        padding: 18px;
      }

      .screen {
        width: 414px;
        height: calc(100vh - 36px);
        max-height: calc(100vh - 36px);
        border: 1px solid rgba(228, 215, 205, 0.95);
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="screen" aria-label="Profile screen">
      <div class="content">
        <header class="topbar site-header">
          <div class="topbar-side">
            <button class="icon-button" type="button" id="backButton" aria-label="Go back">
              <svg viewBox="0 0 24 24">
                <path d="M15 18 9 12l6-6"></path>
              </svg>
            </button>
          </div>

          <h1 class="topbar-title" data-i18n="profileTitle">Profile</h1>

          <div class="topbar-side" aria-hidden="true"></div>
        </header>

        <section class="hero">
          <div class="avatar-wrap">
            <div class="avatar-shell" aria-hidden="true">
              <svg class="avatar-placeholder-icon" viewBox="0 0 24 24">
                <path d="M12 11.25a4.25 4.25 0 1 0 0-8.5a4.25 4.25 0 0 0 0 8.5Z"></path>
                <path d="M5.25 20.25a6.75 6.75 0 0 1 13.5 0"></path>
              </svg>
              <p class="avatar-initials" id="avatarInitials">MT</p>
            </div>
            <button class="avatar-edit" type="button" id="avatarEditButton" aria-label="Edit profile" data-i18n-aria-label="editProfile">
              <svg viewBox="0 0 24 24">
                <path d="m4 20 4.5-1 9-9a2.1 2.1 0 0 0-3-3l-9 9L4 20Z"></path>
                <path d="m13.5 7.5 3 3"></path>
              </svg>
            </button>
          </div>

          <h2 class="profile-name" id="profileName">Margaret Thompson</h2>
          <p class="profile-email" id="profileEmail">margaret@example.com</p>
        </section>

        <section class="section" aria-labelledby="detailsTitle">
          <div class="section-head">
            <h2 id="detailsTitle" data-i18n="yourDetails">Your Details</h2>
            <button class="edit-chip" type="button" id="editDetailsButton" data-i18n="edit">Edit</button>
          </div>

          <div class="card details-card">
            <button class="detail-row" type="button" id="birthYearButton">
              <div class="detail-content">
                <p class="detail-label" data-i18n="birthYear">Birth Year</p>
                <p class="detail-value" id="birthYearValue">1955</p>
              </div>
              <span class="detail-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="m9 6 6 6-6 6"></path>
                </svg>
              </span>
            </button>

            <button class="detail-row" type="button" id="fitnessLevelButton">
              <div class="detail-content">
                <p class="detail-label" data-i18n="fitnessLevel">Fitness Level</p>
                <p class="detail-value" id="fitnessLevelValue">Beginner</p>
              </div>
              <span class="detail-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="m9 6 6 6-6 6"></path>
                </svg>
                </span>
            </button>

            <button class="detail-row" type="button" id="goalButton">
              <div class="detail-main">
                <img class="goal-icon" id="goalIcon" src="image/balance and stability icon.png" alt="" aria-hidden="true">
                <div class="detail-content">
                  <p class="detail-label" data-i18n="mainGoal">Main Goal</p>
                  <p class="detail-value" id="goalValue">Balance &amp; Stability</p>
                </div>
              </div>
              <span class="detail-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="m9 6 6 6-6 6"></path>
                </svg>
              </span>
            </button>
          </div>
        </section>

        <section class="section" aria-labelledby="preferencesTitle">
          <div class="section-head">
            <h2 id="preferencesTitle" data-i18n="preferences">Preferences</h2>
          </div>

          <div class="card preferences-card">
            <div class="pref-row">
              <div class="pref-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 6h16v12H4z"></path>
                  <path d="m4 7 8 6 8-6"></path>
                </svg>
              </div>
              <div class="pref-label" data-i18n="emailReminders">Email reminders</div>
              <label class="switch" aria-label="Email reminders" data-i18n-aria-label="emailReminders">
                <input type="checkbox" id="emailToggle">
                <span class="slider"></span>
              </label>
            </div>

            <div class="pref-row">
              <div class="pref-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M5 8h6"></path>
                  <path d="M8 8v8"></path>
                  <path d="M13 8h6"></path>
                  <path d="M16 8v8"></path>
                </svg>
              </div>
              <div class="pref-label" data-i18n="largerTextMode">Larger text mode</div>
              <label class="switch" aria-label="Larger text mode" data-i18n-aria-label="largerTextMode">
                <input type="checkbox" id="textToggle">
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </section>

        <section class="account-block" aria-labelledby="accountTitle">
          <div class="section-head">
            <h2 id="accountTitle" data-i18n="account">Account</h2>
          </div>

          <button class="secondary-button" type="button" id="remindersButton" data-i18n="reminders">Reminders</button>
          <button class="secondary-button" type="button" id="reportsButton" data-i18n="shareReport">Share report with caregiver</button>
          <button class="logout-button" type="button" id="logoutButton" data-i18n="logout">Log Out</button>
          <p class="version">Version 2.4.1 (Stable)</p>
        </section>
      </div>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <div class="nav-list">
          <button class="nav-button" type="button" id="homeButton" aria-label="Home" data-i18n-aria-label="homeNav">
            <span class="nav-pill">
              <img class="nav-icon-img" src="image/wellora home icon.jpeg" alt="" aria-hidden="true">
            </span>
            <span data-i18n="homeNav">Home</span>
          </button>

          <button class="nav-button" type="button" id="progressButton" aria-label="Progress" data-i18n-aria-label="progressNav">
            <span class="nav-pill">
              <img class="nav-icon-img" src="image/wellora progress icon.jpeg" alt="" aria-hidden="true">
            </span>
            <span data-i18n="progressNav">Progress</span>
          </button>

          <button class="nav-button" type="button" aria-label="Voice Help" id="navVoiceButton">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"></path>
                <path d="M19 11a7 7 0 0 1-14 0"></path>
                <path d="M12 18v3"></path>
                <path d="M8 21h8"></path>
              </svg>
            </span>
            <span>Voice</span>
          </button>
          <button class="nav-button" type="button" aria-label="Guide" id="navGuideButton">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"></path>
              </svg>
            </span>
            <span>Guide</span>
          </button>

          <button class="nav-button" type="button" aria-label="Ask Wellora AI" id="navAiButton"
            data-i18n-aria-label="aiNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-9 12-1.5-3.5L6 9l3.5-1.5L11 4l1.5 3.5L16 9l-3.5 1.5L11 14zm6-2-.75-1.75L14.5 9.5l1.75-.75L17 7l.75 1.75 1.75.75-1.75.75L17 12z"></path>
              </svg>
            </span>
            <span data-i18n="aiNav">Ask Wellora AI</span>
          </button>
          <button class="nav-button is-active" type="button" id="profileNavButton" aria-label="Profile" data-i18n-aria-label="profileNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24">
                <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"></path>
              </svg>
            </span>
            <span data-i18n="profileNav">Profile</span>
          </button>
        </div>
      </nav>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script src="translations.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();
    const profileKey = "welloraProfile";
    const defaultProfile = {
      name: "Margaret Thompson",
      email: "margaret@example.com",
      birthYear: "1955",
      fitnessLevel: "Beginner",
      mainGoal: "Balance & Stability",
      emailReminders: true,
      largeText: false
    };

    function readProfile() {
      try {
        const stored = JSON.parse(localStorage.getItem(profileKey) || "null");
        return stored ? { ...defaultProfile, ...stored } : { ...defaultProfile };
      } catch (error) {
        return { ...defaultProfile };
      }
    }

    function saveProfile(profile) {
      localStorage.setItem(profileKey, JSON.stringify(profile));
    }

    function getInitials(name) {
      return name
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(function (part) {
          return part.charAt(0).toUpperCase();
        })
        .join("") || "WL";
    }

    const profile = readProfile();

    const profileName = document.getElementById("profileName");
    const profileEmail = document.getElementById("profileEmail");
    const avatarInitials = document.getElementById("avatarInitials");
    const birthYearValue = document.getElementById("birthYearValue");
    const fitnessLevelValue = document.getElementById("fitnessLevelValue");
    const goalValue = document.getElementById("goalValue");
    const goalIcon = document.getElementById("goalIcon");
    const emailToggle = document.getElementById("emailToggle");
    const textToggle = document.getElementById("textToggle");
    const backButton = document.getElementById("backButton");
    const avatarEditButton = document.getElementById("avatarEditButton");
    const editDetailsButton = document.getElementById("editDetailsButton");
    const birthYearButton = document.getElementById("birthYearButton");
    const fitnessLevelButton = document.getElementById("fitnessLevelButton");
    const goalButton = document.getElementById("goalButton");
    const goalIcons = {
      "Balance & Stability": "image/balance and stability icon.png",
      "Balance and Stability": "image/balance and stability icon.png",
      "Flexibility": "image/flexibility.png",
      "Weight Control and Metabolism": "image/weight and control metabolism.png",
      "Boosting Metabolism": "image/bosting metabolism.png",
      "Sexual Health": "image/sexual health.png",
      "Mobility and Flexibility": "image/mobility and flexibility.png",
      "Sleep and Mental Wellbeing": "image/sleep and mental wellbeing.png",
      "Energy Levels": "image/energy levels.png",
      "Cognitive Function": "image/cognitive function.png"
    };
    const logoutButton = document.getElementById("logoutButton");
    const remindersButton = document.getElementById("remindersButton");
    const reportsButton = document.getElementById("reportsButton");
    const homeButton = document.getElementById("homeButton");
    const progressButton = document.getElementById("progressButton");
    const profileNavButton = document.getElementById("profileNavButton");

    function t(key, fallback) {
      return window.WelloraI18n ? window.WelloraI18n.t(key, fallback) : (fallback || key);
    }

    function applyProfileTranslations() {
      window.WelloraI18n.applyTranslations(document);
      document.title = t("profileTitle", "Profile") + " | Wellora";
    }

    function renderProfile() {
      profileName.textContent = profile.name;
      profileEmail.textContent = profile.email;
      avatarInitials.textContent = getInitials(profile.name);
      birthYearValue.textContent = profile.birthYear;
      fitnessLevelValue.textContent = profile.fitnessLevel;
      goalValue.textContent = profile.mainGoal;
      goalIcon.src = goalIcons[profile.mainGoal] || "image/wellora logo.png";
      emailToggle.checked = Boolean(profile.emailReminders);
      textToggle.checked = Boolean(profile.largeText);
      document.body.classList.toggle("large-text", Boolean(profile.largeText));
    }

    async function requireUser() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data || !data.user) {
        window.location.href = "login.html";
        return null;
      }

      const syncedProfile = window.WelloraFlow.syncProfileFromUser(data.user);
      Object.assign(profile, syncedProfile);

      const goalFromStorage = localStorage.getItem("welloraMainGoal");

      if (goalFromStorage) {
        profile.mainGoal = goalFromStorage;
      }

      saveProfile(profile);
      renderProfile();
      return data.user;
    }

    function editField(field, label, options) {
      const currentValue = profile[field];
      const message = options && options.length
        ? label + " (" + options.join(", ") + ")"
        : label;
      const nextValue = window.prompt(message, currentValue);

      if (!nextValue) {
        return;
      }

      profile[field] = nextValue.trim();
      saveProfile(profile);
      renderProfile();
    }

    renderProfile();

    backButton.addEventListener("click", function () {
      window.history.length > 1 ? window.history.back() : window.location.href = "home.html";
    });

    avatarEditButton.addEventListener("click", function () {
      editField("name", "Update your name");
      const nextEmail = window.prompt("Update your email", profile.email);

      if (nextEmail) {
        profile.email = nextEmail.trim();
        saveProfile(profile);
        renderProfile();
      }
    });

    editDetailsButton.addEventListener("click", function () {
      editField("birthYear", t("birthYear", "Birth year"));
      editField("fitnessLevel", t("fitnessLevel", "Fitness level"), ["Beginner", "Intermediate", "Advanced"]);
      editField("mainGoal", t("mainGoal", "Main goal"));
    });

    birthYearButton.addEventListener("click", function () {
      editField("birthYear", t("birthYear", "Birth year"));
    });

    fitnessLevelButton.addEventListener("click", function () {
      editField("fitnessLevel", t("fitnessLevel", "Fitness level"), ["Beginner", "Intermediate", "Advanced"]);
    });

    goalButton.addEventListener("click", function () {
      editField("mainGoal", t("mainGoal", "Main goal"));
    });

    emailToggle.addEventListener("change", function () {
      profile.emailReminders = emailToggle.checked;
      saveProfile(profile);
    });

    textToggle.addEventListener("change", function () {
      profile.largeText = textToggle.checked;
      saveProfile(profile);
      renderProfile();
    });

    logoutButton.addEventListener("click", async function () {
      try {
        await supabaseClient.auth.signOut();
      } catch (error) {
      }

      window.WelloraFlow.clearAuthIntent();
      window.location.href = "login.html";
    });

    remindersButton.addEventListener("click", function () {
      window.location.href = "reminders.html";
    });

    reportsButton.addEventListener("click", function () {
      window.location.href = "reports.html";
    });

    homeButton.addEventListener("click", function () {
      window.location.href = "home.html";
    });

    progressButton.addEventListener("click", function () {
      window.location.href = "progress.html";
    });

    profileNavButton.addEventListener("click", function () {
      window.location.href = "profile.html";
    });

    const navAiButton = document.getElementById("navAiButton");
    if (navAiButton) {
      navAiButton.addEventListener("click", function () {
        window.location.href = "ai-chat.html";
      });
    }

    applyProfileTranslations();
    window.addEventListener("wellora:languagechange", applyProfileTranslations);

    requireUser();
  </script>
  <script src="voice-control.js"></script>
  <script src="legal-footer.js"></script>
  <script src="wellora-guide.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
