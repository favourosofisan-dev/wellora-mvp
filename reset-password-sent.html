<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Wellora Security</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <style>
    :root {
      --bg: #fbf7f2;
      --text: #26201c;
      --muted: #6f6057;
      --accent: #8a4926;
      --border: rgba(138, 73, 38, 0.9);
      --shadow: 0 18px 40px rgba(125, 94, 72, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.98), transparent 20%),
        radial-gradient(circle at 100% 0, rgba(238, 213, 193, 0.28), transparent 18%),
        linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 8px;
    }

    .screen {
      width: min(100%, 390px);
      min-height: 100vh;
      background: linear-gradient(180deg, #fdfaf7 0%, #fbf6f0 100%);
      border-left: 1px solid rgba(228, 215, 205, 0.95);
      border-right: 1px solid rgba(228, 215, 205, 0.95);
      box-shadow: 0 18px 42px rgba(116, 89, 71, 0.12);
      position: relative;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 24px 22px;
      color: var(--accent);
      border-bottom: 1px solid rgba(232, 221, 213, 0.7);
    }

    .icon-button,
    .text-button,
    .secondary-button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .icon-button {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .icon-button svg,
    .mail-badge svg {
      width: 44px;
      height: 44px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #302824;
    }

    .content {
      padding: 34px 24px 40px;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .icon-shell {
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.84) 0%, rgba(248, 242, 237, 0.92) 56%, rgba(243, 236, 230, 0.58) 100%);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }

    .icon-center {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      display: grid;
      place-items: center;
    }

    .mail-badge {
      width: 104px;
      height: 104px;
      border-radius: 16px;
      background: var(--accent);
      color: #fffaf5;
      display: grid;
      place-items: center;
    }

    .hero {
      margin-top: 56px;
    }

    .hero h1 {
      margin: 0;
      font-size: 3rem;
      line-height: 0.96;
      letter-spacing: -0.085em;
      font-weight: 800;
    }

    .hero p {
      margin: 22px auto 0;
      max-width: 290px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .email-pill {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      background: #ece5df;
      color: #2f2824;
      font-size: 0.98rem;
      font-weight: 800;
    }

    .resend {
      margin-top: 54px;
    }

    .text-button {
      color: var(--accent);
      font-size: 0.98rem;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .footer-action {
      margin-top: auto;
      width: 100%;
      padding-top: 38px;
    }

    .secondary-button {
      width: 100%;
      min-height: 58px;
      border-radius: 18px;
      border: 2px solid var(--border);
      color: var(--accent);
      font-size: 1rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.18);
    }

    @media (max-width: 360px) {
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .hero h1 {
        font-size: 2.55rem;
      }
    }

    @media (min-width: 768px) {
      .page {
        padding: 18px;
      }

      .screen {
        width: 414px;
        border: 1px solid rgba(228, 215, 205, 0.95);
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="screen" aria-label="Reset password confirmation screen">
      <header class="header">
        <button class="icon-button" type="button" id="backButton" aria-label="Go back">
          <svg viewBox="0 0 24 24">
            <path d="M15 18 9 12l6-6"></path>
          </svg>
        </button>
        <h1 class="header-title">Security</h1>
      </header>

      <div class="content">
        <div class="icon-shell" aria-hidden="true">
          <div class="icon-center">
            <div class="mail-badge">
              <svg viewBox="0 0 24 24">
                <path d="M4 6h16v12H4z"></path>
                <path d="m4 7 8 6 8-6"></path>
              </svg>
            </div>
          </div>
        </div>

        <section class="hero">
          <h1>Check your email</h1>
          <p>We sent a password reset link to:</p>
          <div class="email-pill" id="maskedEmail">m***@example.com</div>
          <p>Click the link in the email to create a new password. The link will expire in 1 hour.</p>
        </section>

        <div class="resend">
          <button class="text-button" type="button" id="resendButton">Resend email</button>
        </div>

        <div class="footer-action">
          <button class="secondary-button" type="button" id="backToLoginButton">Back to login</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();
    function maskEmail(email) {
      const parts = email.split("@");

      if (parts.length !== 2) {
        return "m***@example.com";
      }

      const name = parts[0];
      const domain = parts[1];
      const visible = name.slice(0, 1) || "m";
      return visible + "***@" + domain;
    }

    const params = new URLSearchParams(window.location.search);
    const email = params.get("email") || localStorage.getItem("welloraResetEmail") || "margaret@example.com";

    const maskedEmail = document.getElementById("maskedEmail");
    const backButton = document.getElementById("backButton");
    const resendButton = document.getElementById("resendButton");
    const backToLoginButton = document.getElementById("backToLoginButton");

    function getBaseUrl() {
      return window.location.origin + window.location.pathname.replace(/[^/]*$/, "");
    }

    maskedEmail.textContent = maskEmail(email);

    backButton.addEventListener("click", function () {
      window.location.href = "forgot-password.html";
    });

    resendButton.addEventListener("click", async function () {
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: getBaseUrl() + "login.html"
        });

        if (error) {
          throw error;
        }

        window.alert("A fresh reset link has been sent to " + email + ".");
      } catch (error) {
        window.alert(error.message || "We couldn't resend the email right now.");
      }
    });

    backToLoginButton.addEventListener("click", function () {
      window.location.href = "login.html";
    });
  </script>
  <script src="/pwa.js"></script>
</body>
</html>
