<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Caregiver Report | Wellora</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #000000;
      --muted: #202020;
      --accent: #8d4825;
      --border: rgba(141, 72, 37, 0.16);
      --shadow: 0 10px 24px rgba(34, 24, 18, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #ffffff;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px 12px;
      background: #ffffff;
    }

    .screen {
      width: min(100%, 430px);
      min-height: calc(100vh - 22px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
    }

    .icon-button {
      width: 48px;
      min-width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      color: var(--accent);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-button svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-title {
      margin: 3px 0 0;
      font-size: 1.25rem;
      line-height: 1.2;
      font-weight: 800;
    }

    .content {
      flex: 1;
      display: grid;
      align-content: start;
      gap: 14px;
      padding: 16px 16px 120px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .report-card,
    .status-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(34, 24, 18, 0.08);
    }

    .report-card {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .report-title {
      margin: 0;
      color: var(--accent);
      font-size: 1.15rem;
      line-height: 1.2;
      font-weight: 800;
    }

    .report-text {
      margin: 0;
      white-space: pre-wrap;
      color: #000000;
      font-size: 0.98rem;
      line-height: 1.55;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      min-height: 78px;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      text-align: center;
    }

    .stat-value {
      margin: 0;
      color: var(--accent);
      font-size: 1.15rem;
      line-height: 1;
      font-weight: 800;
    }

    .stat-label {
      margin: 0;
      color: #000000;
      font-size: 0.76rem;
      line-height: 1.2;
      font-weight: 800;
    }

    .recent-list {
      display: grid;
      gap: 8px;
    }

    .recent-item {
      display: grid;
      gap: 3px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
    }

    .recent-title {
      margin: 0;
      color: #000000;
      font-size: 0.92rem;
      line-height: 1.2;
      font-weight: 800;
    }

    .recent-meta {
      margin: 0;
      color: #202020;
      font-size: 0.8rem;
      line-height: 1.25;
      font-weight: 700;
    }

    .actions {
      position: sticky;
      bottom: 0;
      z-index: 20;
      display: grid;
      gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
    }

    .whatsapp-button,
    .secondary-button {
      min-height: 48px;
      border-radius: 14px;
      font-size: 0.96rem;
      line-height: 1.2;
      font-weight: 800;
      cursor: pointer;
    }

    .whatsapp-button {
      border: 0;
      background: var(--accent);
      color: #ffffff;
    }

    .whatsapp-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--accent);
    }

    .status-card {
      display: none;
      padding: 12px;
      color: #000000;
      font-size: 0.92rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .status-card.is-visible {
      display: block;
    }

    .loading {
      color: #202020;
      font-weight: 800;
    }

    @media (max-width: 767px) {
      .page {
        padding: 0;
      }

      .screen {
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="screen">
      <header class="header">
        <button class="icon-button" type="button" id="backButton" aria-label="Go back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18 9 12l6-6"></path>
          </svg>
        </button>
        <div class="header-copy">
          <p class="eyebrow">Caregiver report</p>
          <h1 class="header-title">Share Wellora progress</h1>
        </div>
      </header>

      <section class="content">
        <article class="report-card">
          <h2 class="report-title">Report preview</h2>
          <p class="report-text" id="reportText"><span class="loading">Generating report...</span></p>
        </article>

        <section class="stats-grid" aria-label="Report summary">
          <div class="stat">
            <p class="stat-value" id="completedValue">0</p>
            <p class="stat-label">Completed</p>
          </div>
          <div class="stat">
            <p class="stat-value" id="minutesValue">0</p>
            <p class="stat-label">Minutes</p>
          </div>
          <div class="stat">
            <p class="stat-value" id="streakValue">0</p>
            <p class="stat-label">Day streak</p>
          </div>
        </section>

        <article class="report-card">
          <h2 class="report-title">Recent sessions</h2>
          <div class="recent-list" id="recentList">
            <p class="report-text">Loading recent activity...</p>
          </div>
        </article>

        <p class="status-card" id="statusMessage" aria-live="polite"></p>
      </section>

      <div class="actions">
        <button class="whatsapp-button" type="button" id="whatsappButton" disabled>Share on WhatsApp</button>
        <button class="secondary-button" type="button" id="refreshButton">Regenerate report</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();
    const profileKey = "welloraProfile";
    const reportText = document.getElementById("reportText");
    const recentList = document.getElementById("recentList");
    const completedValue = document.getElementById("completedValue");
    const minutesValue = document.getElementById("minutesValue");
    const streakValue = document.getElementById("streakValue");
    const statusMessage = document.getElementById("statusMessage");
    const whatsappButton = document.getElementById("whatsappButton");
    const refreshButton = document.getElementById("refreshButton");
    const backButton = document.getElementById("backButton");
    let currentShareText = "";

    function readProfile() {
      try {
        return JSON.parse(localStorage.getItem(profileKey) || "null") || {};
      } catch (error) {
        return {};
      }
    }

    function showStatus(message) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle("is-visible", Boolean(message));
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "Date unavailable";
      }

      return date.toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function formatMinutes(minutes) {
      const safeMinutes = Number(minutes);
      if (!Number.isFinite(safeMinutes) || safeMinutes <= 0) {
        return "0 min";
      }

      if (safeMinutes < 1) {
        return "<1 min";
      }

      return Math.round(safeMinutes) + " min";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getCompletionDateKey(row) {
      const date = new Date(row.created_at);
      if (Number.isNaN(date.getTime())) {
        return "";
      }

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return year + "-" + month + "-" + day;
    }

    function calculateStreak(rows) {
      const completedDates = new Set(rows.map(getCompletionDateKey).filter(Boolean));
      let streak = 0;
      const cursor = new Date();
      cursor.setHours(0, 0, 0, 0);

      while (true) {
        const key = cursor.toISOString().slice(0, 10);
        if (!completedDates.has(key)) {
          break;
        }

        streak += 1;
        cursor.setDate(cursor.getDate() - 1);
      }

      return streak;
    }

    async function requireUser() {
      const { data, error } = await supabaseClient.auth.getUser();
      if (error || !data || !data.user) {
        window.location.href = "login.html";
        return null;
      }

      return data.user;
    }

    async function loadProgress(userId) {
      const { data, error } = await supabaseClient
        .from("user_progress")
        .select("id, created_at, exercise_id, count, duration_spent")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });

      if (error) {
        throw error;
      }

      return data || [];
    }

    async function loadExercisesByIds(ids) {
      if (!ids.length) {
        return [];
      }

      const { data, error } = await supabaseClient
        .from("EXERCISES")
        .select("id, exercise_name, category, duration_seconds")
        .in("id", ids);

      if (error) {
        throw error;
      }

      return data || [];
    }

    function buildRecentMarkup(items) {
      if (!items.length) {
        return '<p class="report-text">No completed exercises yet.</p>';
      }

      return items.slice(0, 5).map(function (item) {
        return (
          '<div class="recent-item">' +
            '<p class="recent-title">' + escapeHtml(item.title) + "</p>" +
            '<p class="recent-meta">' + escapeHtml(item.date) + " • " + escapeHtml(item.minutes) + "</p>" +
          "</div>"
        );
      }).join("");
    }

    function buildReport(profile, rows, exerciseMap) {
      const name = profile.name || "Wellora user";
      const totalCompleted = rows.reduce(function (sum, row) {
        const count = Number(row.count);
        return sum + (Number.isFinite(count) && count > 0 ? count : 1);
      }, 0);
      const totalMinutes = rows.reduce(function (sum, row) {
        const storedDuration = Number(row.duration_spent);
        const detail = exerciseMap.get(row.exercise_id);
        const exerciseDuration = Number(detail && detail.duration_seconds);
        const seconds = Number.isFinite(storedDuration) && storedDuration > 0
          ? storedDuration
          : (Number.isFinite(exerciseDuration) ? exerciseDuration : 0);
        const count = Number(row.count);
        const safeCount = Number.isFinite(count) && count > 0 ? count : 1;
        return sum + (seconds * safeCount / 60);
      }, 0);
      const streak = calculateStreak(rows);
      const recentItems = rows.slice(0, 5).map(function (row) {
        const detail = exerciseMap.get(row.exercise_id);
        const storedDuration = Number(row.duration_spent);
        const exerciseDuration = Number(detail && detail.duration_seconds);
        const seconds = Number.isFinite(storedDuration) && storedDuration > 0
          ? storedDuration
          : (Number.isFinite(exerciseDuration) ? exerciseDuration : 0);

        return {
          title: detail && detail.exercise_name ? detail.exercise_name : "Exercise " + row.exercise_id,
          date: formatDate(row.created_at),
          minutes: formatMinutes(seconds / 60)
        };
      });
      const generatedDate = new Date().toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      const summary = [
        "Wellora caregiver report",
        "Generated: " + generatedDate,
        "",
        "Name: " + name,
        "Main goal: " + (profile.mainGoal || "Not set"),
        "Fitness level: " + (profile.fitnessLevel || "Not set"),
        "",
        "Progress summary:",
        "- Exercises completed: " + totalCompleted,
        "- Total active time: " + formatMinutes(totalMinutes),
        "- Current streak: " + streak + " day" + (streak === 1 ? "" : "s"),
        "",
        "Recent sessions:"
      ];

      if (recentItems.length) {
        recentItems.forEach(function (item) {
          summary.push("- " + item.title + " (" + item.date + ", " + item.minutes + ")");
        });
      } else {
        summary.push("- No completed exercises yet.");
      }

      summary.push("");
      summary.push("Note: This report is for wellness tracking only and is not medical advice.");

      return {
        text: summary.join("\n"),
        totalCompleted: totalCompleted,
        totalMinutes: totalMinutes,
        streak: streak,
        recentItems: recentItems
      };
    }

    async function generateReport() {
      showStatus("");
      whatsappButton.disabled = true;
      reportText.textContent = "Generating report...";
      recentList.innerHTML = '<p class="report-text">Loading recent activity...</p>';

      try {
        const user = await requireUser();
        if (!user) {
          return;
        }

        const profile = readProfile();
        const rows = await loadProgress(user.id);
        const ids = Array.from(new Set(rows.map(function (row) {
          return row.exercise_id;
        }).filter(function (id) {
          return id !== null && id !== undefined;
        })));
        const exercises = await loadExercisesByIds(ids);
        const exerciseMap = new Map(exercises.map(function (exercise) {
          return [exercise.id, exercise];
        }));
        const report = buildReport(profile, rows, exerciseMap);

        currentShareText = report.text;
        reportText.textContent = report.text;
        completedValue.textContent = String(report.totalCompleted);
        minutesValue.textContent = formatMinutes(report.totalMinutes);
        streakValue.textContent = String(report.streak);
        recentList.innerHTML = buildRecentMarkup(report.recentItems);
        whatsappButton.disabled = false;
      } catch (error) {
        reportText.textContent = "We couldn't generate the report right now.";
        recentList.innerHTML = '<p class="report-text">Recent activity is unavailable.</p>';
        showStatus(error.message || "Please try again in a moment.");
      }
    }

    whatsappButton.addEventListener("click", function () {
      if (!currentShareText) {
        return;
      }

      const profile = readProfile();
      let phone = profile.caregiverPhone || "";
      phone = String(phone).trim();

      if (phone.startsWith("+")) {
        phone = phone.slice(1);
      }

      phone = phone.replace(/\D/g, "");

      const text = encodeURIComponent(currentShareText);
      const url = phone ? ("https://wa.me/" + phone + "?text=" + text) : ("https://wa.me/?text=" + text);

      window.open(url, "_blank", "noopener");
    });

    refreshButton.addEventListener("click", generateReport);

    backButton.addEventListener("click", function () {
      window.location.href = "home.html";
    });

    generateReport();
  </script>
  <script src="/pwa.js"></script>
</body>
</html>
