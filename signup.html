<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Wellora Sign Up</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    :root {
      --bg: #f7f2eb;
      --surface: rgba(255, 252, 248, 0.94);
      --surface-strong: #fffaf5;
      --text: #221d1a;
      --muted: #7b6b63;
      --border: rgba(231, 219, 210, 0.96);
      --accent: #8d4825;
      --accent-strong: #733b1d;
      --shadow: 0 20px 44px rgba(118, 77, 48, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(160, 92, 54, 0.2), transparent 18%),
        radial-gradient(circle at 84% 88%, rgba(160, 92, 54, 0.22), transparent 18%),
        linear-gradient(180deg, #fcf9f5 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    body.signup-screen {
      overflow: hidden;
    }

    body.signup-screen > main.page {
      padding-top: max(8px, env(safe-area-inset-top, 0px)) !important;
      padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)) !important;
      overflow: hidden !important;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: hidden;
      padding: 10px 12px;
      position: relative;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.9;
    }

    .page::before {
      width: 220px;
      height: 220px;
      top: 12px;
      left: -80px;
      background:
        radial-gradient(circle, rgba(160, 92, 54, 0.36) 0 42%, rgba(255, 255, 255, 0.64) 43% 56%, transparent 57%);
    }

    .page::after {
      width: 220px;
      height: 220px;
      right: -88px;
      bottom: 12px;
      background:
        radial-gradient(circle, rgba(160, 92, 54, 0.32) 0 42%, rgba(255, 255, 255, 0.64) 43% 56%, transparent 57%);
    }

    .auth-card {
      width: 100%;
      max-width: 392px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(255, 253, 250, 0.98), rgba(249, 243, 236, 0.98));
      border: 1px solid rgba(234, 222, 212, 0.92);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .auth-card {
      display: grid;
      gap: 12px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(234, 222, 212, 0.8);
    }

    .auth-tab {
      flex: 1 1 0;
      min-height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      text-decoration: none;
      font-weight: 700;
      border: 0;
      color: #745d50;
      background: transparent;
    }

    .auth-tab.is-active {
      background: linear-gradient(180deg, #914c29 0%, #7b3f20 100%);
      color: #fff7f1;
      box-shadow: 0 10px 18px rgba(133, 73, 39, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      font-size: 1.22rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.8rem;
      line-height: 1;
      letter-spacing: -0.05em;
      font-weight: 800;
    }

    .hero p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .input-shell {
      min-height: 48px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 18px rgba(154, 123, 97, 0.08);
    }

    .input-shell:focus-within {
      border-color: rgba(141, 72, 37, 0.45);
      box-shadow: 0 0 0 4px rgba(141, 72, 37, 0.1);
      transform: translateY(-1px);
    }

    .input-icon {
      width: 32px;
      height: 32px;
      stroke: #b39f94;
      flex-shrink: 0;
    }

    .input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.94rem;
      font-family: inherit;
    }

    .input::placeholder {
      color: #b0a198;
    }

    .toggle-password {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      padding: 4px 0 4px 8px;
      font-size: 0.78rem;
    }

    .toggle-password:hover,
    .toggle-password:focus-visible {
      color: var(--accent);
    }

    .primary-button,
    .google-button {
      width: 100%;
      min-height: 46px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .primary-button {
      border: 0;
      background: linear-gradient(180deg, #914c29 0%, #7b3f20 100%);
      color: #fff7f1;
      box-shadow: 0 10px 20px rgba(133, 73, 39, 0.2);
      margin-top: 2px;
    }

    .primary-button:hover,
    .primary-button:focus-visible,
    .google-button:hover,
    .google-button:focus-visible {
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #b2a197;
      font-weight: 700;
      font-size: 0.78rem;
      margin: 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(226, 214, 204, 0.9);
    }

    .google-button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      color: var(--accent-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 18px rgba(154, 123, 97, 0.08);
    }

    .google-button:focus-visible {
      border-color: rgba(141, 72, 37, 0.35);
    }

    .google-icon {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .footer-links {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .notice {
      display: none;
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.35;
      border: 1px solid transparent;
    }

    .notice.show {
      display: block;
    }

    .notice.info {
      background: rgba(247, 239, 229, 0.95);
      border-color: rgba(141, 72, 37, 0.18);
      color: #5d4332;
    }

    .notice.success {
      background: rgba(234, 245, 235, 0.98);
      border-color: rgba(71, 141, 92, 0.22);
      color: #285535;
    }

    .notice.error {
      background: rgba(255, 239, 236, 0.98);
      border-color: rgba(190, 84, 62, 0.22);
      color: #8e3e2d;
    }

    .footer-links a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .footer-links a:hover,
    .footer-links a:focus-visible {
      text-decoration: underline;
    }

    @media (min-width: 480px) {
      .auth-card {
        padding: 18px;
      }

      .brand {
        font-size: 1.28rem;
      }

      .hero h1 {
        font-size: 1.95rem;
      }

      .hero p {
        font-size: 0.92rem;
      }
    }

    @media (min-width: 768px) {
      .page {
        padding: 12px 16px;
      }

      .page::before,
      .page::after {
        width: 250px;
        height: 250px;
      }

      .auth-card {
        max-width: 392px;
        padding: 18px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: max(8px, env(safe-area-inset-top, 0px)) 10px max(8px, env(safe-area-inset-bottom, 0px));
      }

      .auth-card {
        padding: 14px;
      }

      .hero h1 {
        font-size: 1.64rem;
      }

      .hero p {
        font-size: 0.86rem;
      }

      .google-button {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>
<body class="signup-screen">
  <main class="page">
    <section class="auth-card" aria-label="Create your Wellora account">
      <div class="brand">
        <img class="brand-mark" src="image/wellora logo.png" alt="" aria-hidden="true">
        <span>WELLORA</span>
      </div>

      <nav class="auth-tabs" aria-label="Authentication">
        <a class="auth-tab" href="login.html">Sign In</a>
        <a class="auth-tab is-active" href="signup.html" aria-current="page">Sign Up</a>
      </nav>

      <header class="hero">
        <h1>Create your account</h1>
        <p>Your journey to daily vitality starts here.</p>
      </header>

      <div class="notice info show" id="signupNotice">
        Some signups require email confirmation before the account becomes active. If that happens, we will tell you here right away.
      </div>

      <form class="form" id="signupForm" novalidate>
        <div class="input-shell">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true">
            <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
            <path d="M4.5 7l7.5 6 7.5-6"></path>
          </svg>
          <input class="input" type="email" id="email" name="email" placeholder="Email address" autocomplete="email" required>
        </div>

        <div class="input-shell">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true">
            <rect x="5.5" y="10.5" width="13" height="9" rx="2"></rect>
            <path d="M8 10.5V8.7a4 4 0 0 1 8 0v1.8"></path>
            <circle cx="12" cy="14.8" r="1.2"></circle>
          </svg>
          <input class="input" type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required>
          <button class="toggle-password" type="button" data-target="password" aria-label="Show password">Show</button>
        </div>

        <div class="input-shell">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3.5 18 6v5.2c0 4-2.4 7.4-6 8.8-3.6-1.4-6-4.8-6-8.8V6l6-2.5Z"></path>
            <path d="M9.6 12.2 11.2 14l3.3-3.7"></path>
          </svg>
          <input class="input" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>
          <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="Show confirm password">Show</button>
        </div>

        <button class="primary-button" type="submit">Sign Up</button>

        <div class="divider" aria-hidden="true">OR</div>

        <button class="google-button" type="button" id="googleSignupButton">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.55-.21-2.27H12.24v4.3h6.32a5.41 5.41 0 0 1-2.35 3.55v2.95h3.81c2.23-2.05 3.47-5.08 3.47-8.53Z"></path>
            <path fill="#34A853" d="M12.24 24c3.15 0 5.8-1.04 7.73-2.82l-3.81-2.95c-1.04.7-2.37 1.12-3.92 1.12-3.02 0-5.58-2.03-6.49-4.77H1.81v3.04A11.67 11.67 0 0 0 12.24 24Z"></path>
            <path fill="#FBBC05" d="M5.75 14.58a6.98 6.98 0 0 1 0-4.44V7.1H1.81a11.76 11.76 0 0 0 0 10.52l3.94-3.04Z"></path>
            <path fill="#EA4335" d="M12.24 4.73c1.72 0 3.25.59 4.47 1.75l3.35-3.35C18.03 1.19 15.39 0 12.24 0 7.81 0 3.98 2.54 1.81 6.37L5.75 9.4c.91-2.75 3.47-4.67 6.49-4.67Z"></path>
          </svg>
          <span>Continue with Google</span>
        </button>
      </form>

      <p class="footer-links">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();

    const signupForm = document.getElementById("signupForm");
    const googleSignupButton = document.getElementById("googleSignupButton");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const passwordToggles = document.querySelectorAll(".toggle-password");
    const signupNotice = document.getElementById("signupNotice");

    function getBaseUrl() {
      return window.location.origin + window.location.pathname.replace(/[^/]*$/, "");
    }

    function redirectToHome() {
      window.location.href = "home.html";
    }

    function redirectToOnboarding() {
      window.location.href = "onboarding.html";
    }

    function setButtonLoading(button, isLoading, idleLabel) {
      if (!button) {
        return;
      }

      if (!button.dataset.originalText) {
        button.dataset.originalText = idleLabel || button.textContent.trim();
      }

      button.disabled = isLoading;
      button.textContent = isLoading ? "Please wait..." : (idleLabel || button.dataset.originalText);
    }

    function setSignupNotice(message, type) {
      if (!signupNotice) {
        return;
      }

      signupNotice.textContent = message;
      signupNotice.className = "notice show " + (type || "info");
    }

    async function redirectIfAuthenticated() {
      const { data } = await supabaseClient.auth.getSession();

      if (data && data.session && data.session.user) {
        window.WelloraFlow.syncProfileFromUser(data.session.user);
        window.location.href = window.WelloraFlow.resolveAuthenticatedDestination(data.session.user, "home.html");
      }
    }

    async function signUpWithEmailPassword(email, password, confirmPassword) {
      if (password !== confirmPassword) {
        throw new Error("Your passwords do not match yet. Please check them again.");
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: getBaseUrl() + "splash.html"
        }
      });

      if (error) {
        if ((error.message || "").toLowerCase().includes("invalid api key")) {
          throw new Error("Supabase rejected the public API key in supabase-config.js. Replace it with your current anon key from the Supabase dashboard.");
        }

        throw error;
      }

      if (data && data.user) {
        window.WelloraFlow.syncProfileFromUser(data.user);
        window.WelloraFlow.markOnboardingPending(data.user);
      }

      const emailNeedsConfirmation = Boolean(data && data.user && !data.session);

      if (emailNeedsConfirmation) {
        window.WelloraFlow.clearAuthIntent();
        setSignupNotice(
          "Your account was created, but Supabase still needs you to confirm " + email + " by email before you can log in. Please check your inbox and spam folder, then come back to sign in.",
          "success"
        );
        signupForm.reset();
        return;
      }

      window.WelloraFlow.clearAuthIntent();
      redirectToOnboarding();
    }

    async function signInWithGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: getBaseUrl() + "splash.html"
        }
      });

      if (error) {
        if ((error.message || "").toLowerCase().includes("invalid api key")) {
          throw new Error("Supabase rejected the public API key in supabase-config.js. Replace it with your current anon key from the Supabase dashboard.");
        }

        throw error;
      }
    }

    passwordToggles.forEach(function (button) {
      button.addEventListener("click", function () {
        const input = document.getElementById(button.dataset.target);

        if (!input) {
          return;
        }

        const isVisible = input.type === "text";
        input.type = isVisible ? "password" : "text";
        button.textContent = isVisible ? "Show" : "Hide";
        button.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
      });
    });

    signupForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const submitButton = signupForm.querySelector('button[type="submit"]');
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!email || !password || !confirmPassword) {
        setSignupNotice("Please fill in all fields before signing up.", "error");
        return;
      }

      if (password.length < 6) {
        setSignupNotice("Your password should be at least 6 characters long.", "error");
        return;
      }

      try {
        setSignupNotice("Creating your account now...", "info");
        setButtonLoading(submitButton, true, "Sign Up");
        window.WelloraFlow.setAuthIntent("signup");
        await signUpWithEmailPassword(email, password, confirmPassword);
      } catch (error) {
        window.WelloraFlow.clearAuthIntent();
        setSignupNotice(error.message || "We couldn't create your account. Please try again.", "error");
      } finally {
        setButtonLoading(submitButton, false, "Sign Up");
      }
    });

    googleSignupButton.addEventListener("click", async function () {
      try {
        setButtonLoading(googleSignupButton, true, "Continue with Google");
        window.WelloraFlow.setAuthIntent("signup");
        await signInWithGoogle();
      } catch (error) {
        window.WelloraFlow.clearAuthIntent();
        setButtonLoading(googleSignupButton, false, "Continue with Google");
        window.alert(error.message || "Google sign up could not be started.");
      }
    });

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if ((event === "SIGNED_IN" || event === "INITIAL_SESSION") && session) {
        window.WelloraFlow.syncProfileFromUser(session.user);
        window.location.href = window.WelloraFlow.resolveAuthenticatedDestination(session.user, "home.html");
      }
    });

    redirectIfAuthenticated();
  </script>
  <script src="/pwa.js"></script>
</body>
</html>
