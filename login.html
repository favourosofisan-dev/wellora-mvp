<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellora Login</title>
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <style>
    :root {
      --bg: #f7f2eb;
      --surface: rgba(255, 250, 245, 0.88);
      --surface-strong: #fffaf5;
      --text: #211f1f;
      --muted: #806f66;
      --border: #eaded4;
      --accent: #8d4825;
      --shadow: 0 18px 40px rgba(118, 77, 48, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 85% 40%, rgba(177, 111, 70, 0.28), transparent 18%),
        radial-gradient(circle at 12% 82%, rgba(177, 111, 70, 0.26), transparent 20%),
        linear-gradient(180deg, #fcf9f5 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
      opacity: 0.9;
    }

    .page::before {
      width: 260px;
      height: 260px;
      left: -88px;
      bottom: 16px;
      background:
        radial-gradient(circle, rgba(160, 92, 54, 0.84) 0 46%, rgba(166, 95, 54, 0.48) 47% 62%, rgba(255, 255, 255, 0.92) 63% 68%, transparent 69%);
    }

    .page::after {
      width: 260px;
      height: 260px;
      right: -104px;
      top: 158px;
      background:
        radial-gradient(circle, rgba(160, 92, 54, 0.84) 0 46%, rgba(166, 95, 54, 0.48) 47% 62%, rgba(255, 255, 255, 0.92) 63% 68%, transparent 69%);
    }

    .auth-card {
      width: min(100%, 402px);
      min-height: 86vh;
      background: linear-gradient(180deg, rgba(255, 252, 248, 0.96), rgba(250, 244, 237, 0.98));
      border: 1px solid rgba(234, 222, 212, 0.9);
      box-shadow: var(--shadow);
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 34px;
      color: var(--text);
      font-weight: 800;
      font-size: 1.65rem;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
    }

    .hero h1 {
      margin: 0;
      font-size: 2.55rem;
      line-height: 1.05;
      letter-spacing: -0.05em;
      font-weight: 800;
    }

    .hero p {
      margin: 14px auto 0;
      max-width: 270px;
      color: var(--muted);
      font-size: 1.18rem;
      line-height: 1.5;
    }

    .form {
      display: grid;
      gap: 22px;
    }

    .field-group {
      display: grid;
      gap: 10px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    .field-label,
    .text-link {
      font-size: 1rem;
      font-weight: 700;
    }

    .field-label {
      color: #594d46;
    }

    .text-link {
      color: var(--accent);
      text-decoration: none;
    }

    .text-link:hover,
    .text-link:focus-visible {
      text-decoration: underline;
    }

    .input-shell {
      min-height: 58px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .input-shell:focus-within {
      border-color: rgba(141, 72, 37, 0.45);
      box-shadow: 0 0 0 4px rgba(141, 72, 37, 0.1);
      transform: translateY(-1px);
    }

    .input-icon {
      width: 22px;
      height: 22px;
      stroke: #a89487;
      flex-shrink: 0;
    }

    .input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }

    .input::placeholder {
      color: #b0a198;
    }

    .toggle-password {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      padding: 4px 0 4px 8px;
      font-size: 0.92rem;
    }

    .toggle-password:hover,
    .toggle-password:focus-visible {
      color: var(--accent);
    }

    .primary-button,
    .google-button {
      width: 100%;
      min-height: 60px;
      border-radius: 22px;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .primary-button {
      border: 0;
      background: linear-gradient(180deg, #914c29 0%, #7b3f20 100%);
      color: #fff7f1;
      box-shadow: 0 12px 24px rgba(133, 73, 39, 0.24);
      margin-top: 2px;
    }

    .primary-button:hover,
    .primary-button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(133, 73, 39, 0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 8px 0 0;
      color: #b2a197;
      font-weight: 700;
      justify-content: center;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(226, 214, 204, 0.9);
    }

    .google-button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.72);
      color: #8d4825;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 22px rgba(154, 123, 97, 0.08);
    }

    .google-button:hover,
    .google-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(141, 72, 37, 0.35);
    }

    .google-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .footer-links {
      margin-top: 34px;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .footer-links a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .footer-links a:hover,
    .footer-links a:focus-visible {
      text-decoration: underline;
    }

    .copyright {
      margin: 40px 0 0;
      text-align: center;
      color: #b8a89f;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }

    @media (min-width: 480px) {
      .auth-card {
        padding: 34px 24px 28px;
      }

      .hero h1 {
        font-size: 3rem;
      }

      .hero p {
        font-size: 1.24rem;
      }
    }

    @media (min-width: 768px) {
      .page {
        padding: 28px;
      }

      .page::before {
        width: 330px;
        height: 330px;
        left: -78px;
        bottom: -14px;
      }

      .page::after {
        width: 318px;
        height: 318px;
        right: -96px;
        top: 148px;
      }

      .auth-card {
        width: 430px;
        min-height: 840px;
        padding: 36px 28px 30px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="auth-card" aria-label="Login to Wellora">
      <div>
        <div class="brand" aria-label="Wellora brand">
          <img class="brand-mark" src="image/wellora logo.png" alt="" aria-hidden="true">
          <span>WELLORA</span>
        </div>

        <header class="hero">
          <h1>Welcome back</h1>
          <p>Your sanctuary for wellness and vitality.</p>
        </header>

        <form class="form" id="loginForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="email">Email Address</label>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
                <path d="M4.5 7l7.5 6 7.5-6"></path>
              </svg>
              <input class="input" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
            </div>
          </div>

          <div class="field-group">
            <div class="field-row">
              <label class="field-label" for="password">Password</label>
              <a class="text-link" href="forgot-password.html">Forgot?</a>
            </div>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true">
                <rect x="5.5" y="10.5" width="13" height="9" rx="2"></rect>
                <path d="M8 10.5V8.7a4 4 0 0 1 8 0v1.8"></path>
                <circle cx="12" cy="14.8" r="1.2"></circle>
              </svg>
              <input class="input" type="password" id="password" name="password" placeholder="********" autocomplete="current-password" required>
              <button class="toggle-password" type="button" id="togglePassword" aria-label="Show password">Show</button>
            </div>
          </div>

          <button class="primary-button" type="submit">Log In</button>

          <div class="divider" aria-hidden="true">OR</div>

          <button class="google-button" type="button" id="googleLoginButton">
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.55-.21-2.27H12.24v4.3h6.32a5.41 5.41 0 0 1-2.35 3.55v2.95h3.81c2.23-2.05 3.47-5.08 3.47-8.53Z"></path>
              <path fill="#34A853" d="M12.24 24c3.15 0 5.8-1.04 7.73-2.82l-3.81-2.95c-1.04.7-2.37 1.12-3.92 1.12-3.02 0-5.58-2.03-6.49-4.77H1.81v3.04A11.67 11.67 0 0 0 12.24 24Z"></path>
              <path fill="#FBBC05" d="M5.75 14.58a6.98 6.98 0 0 1 0-4.44V7.1H1.81a11.76 11.76 0 0 0 0 10.52l3.94-3.04Z"></path>
              <path fill="#EA4335" d="M12.24 4.73c1.72 0 3.25.59 4.47 1.75l3.35-3.35C18.03 1.19 15.39 0 12.24 0 7.81 0 3.98 2.54 1.81 6.37L5.75 9.4c.91-2.75 3.47-4.67 6.49-4.67Z"></path>
            </svg>
            <span>Continue with Google</span>
          </button>
        </form>

        <p class="footer-links">
          Don't have an account?
          <a href="signup.html">Sign up</a>
        </p>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const togglePasswordButton = document.getElementById("togglePassword");
    const googleLoginButton = document.getElementById("googleLoginButton");

    function getBaseUrl() {
      return window.location.origin + window.location.pathname.replace(/[^/]*$/, "");
    }

    function redirectToHome() {
      window.location.href = "home.html";
    }

    function setButtonLoading(button, isLoading, idleLabel) {
      if (!button) {
        return;
      }

      if (!button.dataset.originalText) {
        button.dataset.originalText = idleLabel || button.textContent.trim();
      }

      button.disabled = isLoading;
      button.textContent = isLoading ? "Please wait..." : (idleLabel || button.dataset.originalText);
    }

    async function redirectIfAuthenticated() {
      const { data } = await supabaseClient.auth.getSession();

      if (data && data.session && data.session.user) {
        window.WelloraFlow.syncProfileFromUser(data.session.user);
        window.location.href = window.WelloraFlow.resolveAuthenticatedDestination(data.session.user, "home.html");
      }
    }

    async function signInWithEmailPassword(email, password) {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        if ((error.message || "").toLowerCase().includes("invalid api key")) {
          throw new Error("Supabase rejected the public API key in supabase-config.js. Replace it with your current anon key from the Supabase dashboard.");
        }

        if ((error.message || "").toLowerCase().includes("email not confirmed")) {
          throw new Error("Your email address is not confirmed yet. Please open the Supabase confirmation email, then log in again.");
        }

        throw error;
      }

      if (data && data.user) {
        window.WelloraFlow.syncProfileFromUser(data.user);
        window.WelloraFlow.saveUserState(data.user, {
          lastAuthIntent: "login",
          lastLoginAt: new Date().toISOString()
        });
        window.WelloraFlow.clearAuthIntent();
        window.location.href = window.WelloraFlow.resolveAuthenticatedDestination(data.user, "home.html");
        return;
      }

      redirectToHome();
    }

    async function signInWithGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: getBaseUrl() + "splash.html"
        }
      });

      if (error) {
        if ((error.message || "").toLowerCase().includes("invalid api key")) {
          throw new Error("Supabase rejected the public API key in supabase-config.js. Replace it with your current anon key from the Supabase dashboard.");
        }

        throw error;
      }
    }

    window.signInWithEmailPassword = signInWithEmailPassword;
    window.signInWithGoogle = signInWithGoogle;

    if (togglePasswordButton && passwordInput) {
      togglePasswordButton.addEventListener("click", function () {
        const isVisible = passwordInput.type === "text";
        passwordInput.type = isVisible ? "password" : "text";
        togglePasswordButton.textContent = isVisible ? "Show" : "Hide";
        togglePasswordButton.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
      });
    }

    if (loginForm) {
      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const submitButton = loginForm.querySelector('button[type="submit"]');
        const email = emailInput ? emailInput.value.trim() : "";
        const password = passwordInput ? passwordInput.value : "";

        if (!email || !password) {
          window.alert("Please enter both your email address and password.");
          return;
        }

        try {
          setButtonLoading(submitButton, true, "Log In");
          window.WelloraFlow.setAuthIntent("login");
          await signInWithEmailPassword(email, password);
        } catch (error) {
          window.WelloraFlow.clearAuthIntent();
          window.alert(error.message || "We couldn't sign you in. Please try again.");
        } finally {
          setButtonLoading(submitButton, false, "Log In");
        }
      });
    }

    if (googleLoginButton) {
      googleLoginButton.addEventListener("click", async function () {
        try {
          setButtonLoading(googleLoginButton, true, "Continue with Google");
          window.WelloraFlow.setAuthIntent("login");
          await signInWithGoogle();
        } catch (error) {
          window.WelloraFlow.clearAuthIntent();
          setButtonLoading(googleLoginButton, false, "Continue with Google");
          window.alert(error.message || "Google sign in could not be started.");
        }
      });
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if ((event === "SIGNED_IN" || event === "INITIAL_SESSION") && session) {
        window.WelloraFlow.syncProfileFromUser(session.user);
        window.location.href = window.WelloraFlow.resolveAuthenticatedDestination(session.user, "home.html");
      }
    });

    redirectIfAuthenticated();
  </script>
</body>
</html>
