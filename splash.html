<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Wellora Splash</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg, #fcfbf9);
      color: var(--text, #1a1512);
    }

    .splash-page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 12px;
      background: radial-gradient(circle at 90% 8%, rgba(234, 88, 12, 0.08), transparent 40%), var(--bg, #fcfbf9);
    }

    .splash-screen {
      width: min(100%, 820px);
      min-height: calc(100dvh - 24px);
      background: #ffffff;
      border: 1px solid var(--border, #ebdcd0);
      border-radius: 24px;
      box-shadow: 0 16px 44px rgba(60, 40, 25, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px calc(env(safe-area-inset-bottom, 0px) + 36px);
      text-align: center;
    }

    .splash-spacer {
      height: 12px;
      flex-shrink: 0;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 360px;
    }

    .logo-shell {
      width: 96px;
      height: 96px;
      border-radius: 0;
      display: grid;
      place-items: center;
      background: #fffaf6;
      border: 1px solid var(--border, #ebdcd0);
      box-shadow: 0 10px 26px rgba(60, 40, 25, 0.08);
    }

    .logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .brand-eyebrow {
      margin: 0 0 4px;
      color: var(--accent, #b44312);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-text h1 {
      margin: 0;
      color: var(--text, #1a1512);
      font-size: clamp(2.15rem, 6vw, 2.85rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand-text p {
      margin: 10px 0 0;
      color: var(--muted, #52443a);
      font-size: 1rem;
      line-height: 1.55;
      font-weight: 600;
    }

    .loading-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e6d7cb;
      animation: pulse 1.3s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      background: var(--accent, #b44312);
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    .loading-label {
      margin: 0;
      font-size: 0.76rem;
      letter-spacing: 0.22em;
      color: var(--muted, #52443a);
      font-weight: 800;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(0.88);
        opacity: 0.45;
      }

      50% {
        transform: scale(1.18);
        opacity: 1;
      }
    }

    @media (max-width: 767px) {
      .splash-page {
        padding: 0;
      }

      .splash-screen {
        width: 100%;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="splash-page">
    <section class="splash-screen" aria-label="Wellora splash screen">
      <div class="splash-spacer" aria-hidden="true"></div>

      <div class="brand-block">
        <div class="logo-shell" aria-hidden="true">
          <img class="logo" src="image/wellora logo.png" alt="Wellora logo">
        </div>

        <div class="brand-text">
          <p class="brand-eyebrow">Senior Wellness</p>
          <h1>Wellora</h1>
          <p>Simple, gentle guided exercises designed to support mobility, balance, and daily confidence.</p>
        </div>
      </div>

      <section class="loading-block" aria-live="polite">
        <div class="dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <p class="loading-label">Loading...</p>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();

    async function routeFromSplash() {
      try {
        const { data } = await supabaseClient.auth.getSession();
        let destination = "signup.html";

        if (data && data.session && data.session.user) {
          const user = data.session.user;
          const authIntent = window.WelloraFlow.consumeAuthIntent();

          window.WelloraFlow.syncProfileFromUser(user);

          if (authIntent === "signup") {
            window.WelloraFlow.markOnboardingPending(user);
            destination = "onboarding.html";
          } else if (authIntent === "login") {
            window.WelloraFlow.saveUserState(user, {
              lastAuthIntent: "login",
              lastLoginAt: new Date().toISOString()
            });
            destination = window.WelloraFlow.resolveAuthenticatedDestination(user, "home.html");
          } else {
            destination = window.WelloraFlow.resolveAuthenticatedDestination(user, "home.html");
          }
        }

        setTimeout(function () {
          window.location.href = destination;
        }, 1200);
      } catch (error) {
        setTimeout(function () {
          window.location.href = "signup.html";
        }, 1200);
      }
    }

    window.addEventListener("load", routeFromSplash);
  </script>
    <script src="translations.js"></script>
  <script src="legal-footer.js"></script>
  <script src="wellora-guide.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
