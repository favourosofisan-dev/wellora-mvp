<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8d4d2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellora">
  <title>Ask Wellora AI</title>
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="image/wellora logo.png">
  <link rel="stylesheet" href="layout.css">
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: #fffaf6;
      --surface-strong: #ffffff;
      --text: #2b2522;
      --muted: #6f6058;
      --accent: #8d4825;
      --accent-soft: #f6ede6;
      --border: #efe4db;
      --shadow: 0 14px 30px rgba(129, 95, 74, 0.1);
      --nav-shadow: 0 -8px 22px rgba(106, 84, 67, 0.08);
      --user-bubble: #8d4825;
      --ai-bubble: #efe4db;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 8px;
      background:
        radial-gradient(circle at 95% 6%, rgba(255, 166, 127, 0.16), transparent 10%),
        linear-gradient(180deg, #fdfaf6 0%, var(--bg) 100%);
    }

    .screen {
      width: min(100%, 390px);
      min-height: 0;
      height: calc(100vh - env(safe-area-inset-top, 0px) - 24px);
      height: calc(100dvh - env(safe-area-inset-top, 0px) - 24px);
      max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 24px);
      background: linear-gradient(180deg, #fdfaf6 0%, #fbf6f0 100%);
      border: 1px solid rgba(228, 215, 205, 0.95);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 18px 42px rgba(116, 89, 71, 0.12);
      display: flex;
      flex-direction: column;
    }

    .app-shell,
    .screen > .app-shell {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
      display: flex;
      flex-direction: column;
      padding: 10px 16px 6px !important;
      overflow: hidden !important;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(253, 250, 246, 0.98) 0%, rgba(253, 250, 246, 0.92) 100%);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--accent);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }

    .language-control {
      display: grid;
      gap: 2px;
      min-width: 0;
      max-width: 108px;
      position: relative;
    }

    .language-control label {
      color: #8d4825;
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding-left: 2px;
    }

    .language-control::after {
      content: "";
      position: absolute;
      right: 9px;
      bottom: 14px;
      width: 6px;
      height: 6px;
      border-right: 2px solid #8d4825;
      border-bottom: 2px solid #8d4825;
      transform: rotate(45deg);
      pointer-events: none;
    }

    .language-control select {
      width: 100%;
      max-width: 108px;
      min-height: 36px;
      border-radius: 11px;
      border: 1px solid rgba(141, 72, 37, 0.18);
      background: linear-gradient(180deg, rgba(255, 252, 248, 0.98), rgba(247, 238, 229, 0.96));
      color: var(--text);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 5px 22px 5px 9px;
      appearance: none;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .language-control select:focus-visible {
      border-color: rgba(141, 72, 37, 0.36);
      outline: 0;
    }

    /* Chat Area styling */
    .chat-container {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeInBubble 0.25s ease-out;
    }

    @keyframes fadeInBubble {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 1.12rem;
      line-height: 1.5;
      font-weight: 700; /* Large accessibility typography */
      word-wrap: break-word;
      box-shadow: 0 4px 10px rgba(129, 95, 74, 0.05);
    }

    .user .bubble {
      background-color: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background-color: var(--ai-bubble);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .assistant-intro {
      background-color: #faf3ec;
      border: 1px solid rgba(141, 72, 37, 0.12);
      border-radius: 20px;
      padding: 16px;
      font-size: 1.05rem;
      line-height: 1.5;
      font-weight: 700;
      color: #5c4a40;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .assistant-intro strong {
      color: var(--accent);
      font-size: 1.15rem;
    }

    /* Input area styling */
    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px 12px;
      border-top: 1px solid var(--border);
      background: #fdfaf6;
      flex-shrink: 0;
      margin-top: auto;
      position: relative;
      z-index: 2;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      border-radius: 24px;
      border: 1.5px solid #dfd0c3;
      background: #ffffff;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      resize: none;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .text-input:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .send-btn {
      width: 48px !important;
      min-width: 48px !important;
      height: 48px !important;
      min-height: 48px !important;
      padding: 0 !important;
      border-radius: 50% !important;
      border: 0 !important;
      background: var(--accent) !important;
      color: #ffffff !important;
      display: grid !important;
      place-items: center !important;
      cursor: pointer !important;
      flex-shrink: 0 !important;
      box-shadow: 0 4px 12px rgba(141, 72, 37, 0.24) !important;
      transition: background-color 0.2s ease, transform 0.12s ease !important;
    }

    .send-btn:hover {
      background: #783c1d !important;
    }

    .send-btn:active {
      transform: scale(0.94) !important;
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-right: 1px;
      margin-top: 1px;
    }

    /* Loading dots indicator */
    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 18px;
      background-color: var(--ai-bubble);
      border-radius: 20px;
      border-bottom-left-radius: 4px;
      width: max-content;
      animation: fadeInBubble 0.25s ease-out;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      background-color: var(--muted);
      border-radius: 50%;
      animation: pulseDot 1.4s infinite ease-in-out both;
    }

    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulseDot {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Bottom Nav grid adjusted to 6 columns */
    .bottom-nav {
      position: sticky;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 252, 248, 0.98);
      border-top: 1px solid rgba(228, 215, 205, 0.92);
      box-shadow: var(--nav-shadow);
      padding: 10px 10px 14px;
      margin-top: auto;
      z-index: 30;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .nav-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .nav-button {
      border: 0;
      background: transparent;
      display: grid;
      justify-items: center;
      gap: 4px;
      justify-content: center;
      min-height: 44px;
      cursor: pointer;
      color: #000000;
      width: 100%;
      transition: transform 0.2s ease;
    }

    .nav-button.is-active {
      color: var(--accent);
    }

    .nav-pill {
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: transparent;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-button.is-active .nav-pill {
      background: var(--accent);
      color: #fff7f1;
      box-shadow: 0 8px 16px rgba(141, 72, 37, 0.18);
    }

    .nav-button span:last-child {
      color: #000 !important;
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.2;
    }

    @media (max-width: 767px) {
      .screen > .app-shell {
        padding: 8px 12px 6px !important;
      }
      .screen > .bottom-nav,
      .bottom-nav {
        bottom: 0 !important;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px) !important;
      }
      .chat-input-bar {
        padding: 10px 2px 12px;
        gap: 8px;
      }
      .send-btn {
        width: 46px !important;
        min-width: 46px !important;
        height: 46px !important;
        min-height: 46px !important;
      }
      .text-input {
        font-size: 0.98rem;
        min-width: 0;
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="screen" aria-label="Wellora AI chat screen">
      <div class="app-shell">
        <header class="topbar site-header">
          <div class="brand">
            <img class="brand-mark" src="image/wellora logo.png" alt="" aria-hidden="true">
            <span data-i18n="aiNav">Ask Wellora AI</span>
          </div>

          <div class="topbar-actions">
            <div class="language-control">
              <label for="languageSelect" data-i18n="languageLabel">Language</label>
              <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="yo">Yoruba</option>
                <option value="ig">Igbo</option>
                <option value="ha">Hausa</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="zh">中文</option>
              </select>
            </div>
          </div>
        </header>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
          <!-- Welcome intro card -->
          <div class="assistant-intro">
            <strong>Wellora AI</strong>
            <span id="welcomeText" data-i18n="aiWelcome">Hello! I'm Wellora AI. I can answer questions about senior wellness, healthy aging, mobility, gentle exercise, nutrition, sleep, fall prevention, hydration, mental wellbeing, and healthy lifestyle habits. I cannot diagnose illnesses or prescribe medications.</span>
          </div>

          <!-- Dynamic messages appear here -->
          <div id="messagesList" style="display: contents;"></div>
        </div>

        <!-- Input Section -->
        <div class="chat-input-bar">
          <input type="text" class="text-input" id="chatInput" placeholder="Type your question here..." data-i18n-placeholder="aiInputPlaceholder" aria-label="Write a question for Wellora AI">

          <button class="send-btn" id="sendButton" type="button" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 2 11 13"></path>
              <path d="m22 2-7 20-4-9-9-4 20-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav" aria-label="Primary navigation">
        <div class="nav-list">
          <button class="nav-button" type="button" id="homeButton" aria-label="Home" data-i18n-aria-label="homeNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span data-i18n="homeNav">Home</span>
          </button>

          <button class="nav-button" type="button" id="progressButton" aria-label="Progress" data-i18n-aria-label="progressNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                <path d="M8 15v-3"></path>
                <path d="M12 15V8"></path>
                <path d="M16 15v-5"></path>
              </svg>
            </span>
            <span data-i18n="progressNav">Progress</span>
          </button>

          <button class="nav-button" type="button" id="navProfileButton" aria-label="Profile" data-i18n-aria-label="profileNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <span data-i18n="profileNav">Profile</span>
          </button>

          <button class="nav-button" type="button" aria-label="Guide" id="navGuideButton">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            </span>
            <span>Guide</span>
          </button>

          <button class="nav-button is-active" type="button" id="navAiButton" aria-label="Ask Wellora AI" data-i18n-aria-label="aiNav">
            <span class="nav-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>
              </svg>
            </span>
            <span data-i18n="aiNav">Wellora AI</span>
          </button>
        </div>
      </nav>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="wellora-flow.js"></script>
  <script src="translations.js"></script>
  <script>
    const supabaseClient = window.createWelloraSupabaseClient();
    
    // UI elements
    const languageSelect = document.getElementById("languageSelect");
    const chatContainer = document.getElementById("chatContainer");
    const messagesList = document.getElementById("messagesList");
    const chatInput = document.getElementById("chatInput");
    const sendButton = document.getElementById("sendButton");
    const requestTimeoutMs = 25000;

    // Navigation buttons
    const homeButton = document.getElementById("homeButton");
    const progressButton = document.getElementById("progressButton");
    const navProfileButton = document.getElementById("navProfileButton");

    const historyStorageKey = "wellora_ai_chat_history";
    let chatHistory = [];

    function redirectToLogin() {
      window.location.href = "login.html";
    }

    async function requireUser() {
      const { data, error } = await supabaseClient.auth.getUser();
      if (error || !data || !data.user) {
        redirectToLogin();
        return null;
      }
      return data.user;
    }

    function t(key, fallback) {
      return window.WelloraI18n ? window.WelloraI18n.t(key, fallback) : (fallback || key);
    }

    function scrollChatToBottom() {
      chatContainer.scrollTo({
        top: chatContainer.scrollHeight,
        behavior: "smooth"
      });
    }

    function appendMessageUI(text, role) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role === "user" ? "user" : "assistant"}`;
      
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      
      msgDiv.appendChild(bubble);
      messagesList.appendChild(msgDiv);
      scrollChatToBottom();
    }

    function renderHistory() {
      messagesList.innerHTML = "";
      chatHistory.forEach(msg => {
        if (msg.parts && msg.parts[0] && msg.parts[0].text) {
          appendMessageUI(msg.parts[0].text, msg.role);
        }
      });
      scrollChatToBottom();
    }

    function showLoadingIndicator() {
      const loaderDiv = document.createElement("div");
      loaderDiv.className = "message assistant";
      loaderDiv.id = "aiLoader";
      
      const indicator = document.createElement("div");
      indicator.className = "loading-indicator";
      indicator.innerHTML = `
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      `;
      
      loaderDiv.appendChild(indicator);
      messagesList.appendChild(loaderDiv);
      scrollChatToBottom();
    }

    function removeLoadingIndicator() {
      const loader = document.getElementById("aiLoader");
      if (loader) {
        loader.remove();
      }
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = "";
      sendButton.disabled = true;
      
      // Append user message UI and history
      appendMessageUI(text, "user");
      chatHistory.push({
        role: "user",
        parts: [{ text: text }]
      });
      sessionStorage.setItem(historyStorageKey, JSON.stringify(chatHistory));

      // Show loader
      showLoadingIndicator();
      const controller = new AbortController();
      const timeoutId = window.setTimeout(function () {
        controller.abort();
      }, requestTimeoutMs);

      try {
        const response = await fetch("/.netlify/functions/ask-gemini", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ contents: chatHistory }),
          signal: controller.signal
        });
        window.clearTimeout(timeoutId);

        removeLoadingIndicator();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const detailMsg = errData.details || errData.error || ("HTTP error " + response.status);
          throw new Error(detailMsg);
        }

        const data = await response.json();
        const replyText = data.reply || t("aiError", "Sorry, I'm having trouble connecting right now. Please try again.");

        appendMessageUI(replyText, "model");
        
        chatHistory.push({
          role: "model",
          parts: [{ text: replyText }]
        });
        sessionStorage.setItem(historyStorageKey, JSON.stringify(chatHistory));

      } catch (error) {
        console.warn("Wellora AI chat notice:", error && error.message ? error.message : error);
        window.clearTimeout(timeoutId);
        removeLoadingIndicator();
        let displayError = t("aiError", "Sorry, I'm having trouble connecting right now. Please try again.");
        if (error.name === "AbortError") {
          displayError = "Wellora AI is taking too long to respond. Please check your connection and try again.";
        } else if (error.message) {
          if (window.location.protocol === "file:") {
            displayError += ` (Error: Serverless functions cannot run directly from file:// links. Please run via Netlify dev or access your deployed site.)`;
          } else {
            displayError += ` (Detail: ${error.message})`;
          }
        }
        appendMessageUI(displayError, "model");
      } finally {
        sendButton.disabled = false;
      }
    }

    function attachNavigation() {
      homeButton.addEventListener("click", function () {
        window.location.href = "home.html";
      });

      progressButton.addEventListener("click", function () {
        window.location.href = "progress.html";
      });

      if (navProfileButton) {
        navProfileButton.addEventListener("click", function () {
          window.location.href = "profile.html";
        });
      }

      chatInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });

      sendButton.addEventListener("click", sendMessage);
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if (event === "SIGNED_OUT" || !session) {
        redirectToLogin();
      }
    });

    async function init() {
      attachNavigation();

      window.WelloraI18n.initLanguageSelector(languageSelect);
      window.WelloraI18n.applyTranslations(document);

      window.addEventListener("wellora:languagechange", function () {
        window.WelloraI18n.applyTranslations(document);
      });

      const user = await requireUser();
      if (!user) return;

      // Load session history
      const stored = sessionStorage.getItem(historyStorageKey);
      if (stored) {
        try {
          chatHistory = JSON.parse(stored);
          renderHistory();
        } catch (e) {
          chatHistory = [];
        }
      }
    }

    init();
  </script>
  <script src="wellora-guide.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
